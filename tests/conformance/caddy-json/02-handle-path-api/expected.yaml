# Generated by `rdock migrate caddy` from caddy.json: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 12 source item(s): 12 exact, 0 approximate, 0 manual, 0 dropped; 2 finding(s) about the result
# To review (1):
#   - [caddy.default.response_timeout] result: Caddy waits for a backend's answer without a time limit by default; ReverseDock's `timeouts.read` is 60s between two reads (raise it on services with slow answers)
middlewares:
  api-example-com-strip-prefix:
    regex: (?i)^/v1
    replacement: ""
    type: rewrite
routes:
  api-example-com:
    listeners:
    - websecure
    match: Host(`api.example.com`)
    priority: 1
    service: respond-404
  api-example-com-health:
    listeners:
    - websecure
    match: Host(`api.example.com`) && PathRegexp(`(?i)^/health$`)
    priority: 3
    service: respond-200
  api-example-com-v1:
    listeners:
    - websecure
    match: Host(`api.example.com`) && PathRegexp(`(?i)^/v1/`)
    middlewares:
    - api-example-com-strip-prefix
    priority: 2
    service: api-v1-9000
services:
  api-v1-9000:
    backends:
    - address: api-v1:9000
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
  respond-200:
    respond:
      status: 200
  respond-404:
    respond:
      status: 404
