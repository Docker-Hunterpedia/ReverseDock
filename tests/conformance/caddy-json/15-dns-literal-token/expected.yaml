acme:
  dns_provider: digitalocean
  dns_providers:
    cloudflare:
      api_token: ${env:CF_API_TOKEN}
      type: cloudflare
    digitalocean:
      api_token: ${env:DO_AUTH_TOKEN}
      type: digitalocean
listeners:
  web:
    address: ":80"
  websecure:
    address: ":443"
    tls: {}
middlewares:
  files-example-com-static:
    index:
    - index.html
    - index.txt
    listing: true
    precompressed: []
    root: /srv/files
    type: static
routes:
  files-example-com:
    listeners:
    - websecure
    match: Host(`files.example.com`)
    middlewares:
    - files-example-com-static
    priority: 1
    tls:
      dns_provider: cloudflare
