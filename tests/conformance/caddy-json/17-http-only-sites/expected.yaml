defaults:
  redirect_http_to_https: false
listeners:
  http-8080:
    address: ":8080"
  web:
    address: ":80"
routes:
  intranet-example-com:
    listeners:
    - web
    match: Host(`intranet.example.com`)
    priority: 1
    service: intranet-80
    tls: "off"
  ping:
    listeners:
    - http-8080
    match: PathRegexp(`(?i)^/ping$`)
    priority: 1
    service: respond-200
    tls: "off"
services:
  intranet-80:
    backends:
    - address: intranet:80
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
  respond-200:
    respond:
      status: 200
