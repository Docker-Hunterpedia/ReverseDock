#   - [caddy.server.approximate] caddy.json: srv1: key /apps/http/servers/srv1/automatic_https → defaults.redirect_http_to_https: the HTTP-to-HTTPS redirect is off: `defaults.redirect_http_to_https: false` (global, with `--full`)
