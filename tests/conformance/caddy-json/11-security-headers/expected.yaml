middlewares:
  blog-example-com-headers:
    response:
      set:
        Cache-Control: public, max-age=86400
    type: headers
  blog-example-com-headers-2:
    response:
      remove:
      - Server
      set:
        Strict-Transport-Security: max-age=31536000; includeSubDomains
        X-Frame-Options: DENY
    type: headers
routes:
  blog-example-com:
    listeners:
    - websecure
    match: >-
      Host(`blog.example.com`) && !PathRegexp(`(?i)^/assets/`) &&
      !PathRegexp(`(?i)^/debug/`)
    middlewares:
    - blog-example-com-headers-2
    priority: 1
    service: blog-2368
  blog-example-com-assets:
    listeners:
    - websecure
    match: Host(`blog.example.com`) && PathRegexp(`(?i)^/assets/`)
    middlewares:
    - blog-example-com-headers
    - blog-example-com-headers-2
    priority: 3
    service: blog-2368
  blog-example-com-debug:
    enabled: false
    listeners:
    - websecure
    match: Host(`blog.example.com`) && PathRegexp(`(?i)^/debug/`)
    middlewares:
    - blog-example-com-headers-2
    priority: 2
    service: blog-2368
services:
  blog-2368:
    backends:
    - address: blog:2368
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
