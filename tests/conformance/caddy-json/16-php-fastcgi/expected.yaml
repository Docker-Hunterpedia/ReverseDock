middlewares:
  php-example-com-static:
    index:
    - index.html
    - index.txt
    precompressed: []
    root: /var/www/html
    type: static
routes:
  php-example-com:
    enabled: false
    listeners:
    - websecure
    match: Host(`php.example.com`) && !PathRegexp(`(?i)/$`)
    priority: 5
    service: php-example-com-unmigrated
  php-example-com-2:
    enabled: false
    listeners:
    - websecure
    match: Host(`php.example.com`) && PathRegexp(`(?i)/$`) && !PathRegexp(`(?i)\.php$`)
    middlewares:
    - php-example-com-static
    priority: 2
  php-example-com-3:
    enabled: false
    listeners:
    - websecure
    match: Host(`php.example.com`) && PathRegexp(`(?i)/$`) && !PathRegexp(`(?i)\.php$`)
    middlewares:
    - php-example-com-static
    priority: 1
  php-example-com-php:
    enabled: false
    listeners:
    - websecure
    match: Host(`php.example.com`) && PathRegexp(`(?i)/$`) && PathRegexp(`(?i)\.php$`)
    priority: 4
    service: php-example-com-php-unmigrated
