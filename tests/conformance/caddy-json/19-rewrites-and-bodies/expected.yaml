middlewares:
  rewrites-example-com-replace-path:
    path: /about.html
    type: replace_path
  rewrites-example-com-rewrite:
    regex: ^/v([0-9]+)/
    replacement: /api/v$1/
    type: rewrite
  rewrites-example-com-strip-prefix:
    regex: (?i)^/app
    replacement: ""
    type: rewrite
routes:
  rewrites-example-com:
    enabled: false
    listeners:
    - websecure
    match: >-
      Host(`rewrites.example.com`) && !PathRegexp(`(?i)^/about$`) &&
      !PathRegexp(`(?i)^/forbidden/`) && !PathRegexp(`(?i)^/hello$`)
    max_body: 10000000B
    middlewares:
    - rewrites-example-com-strip-prefix
    - rewrites-example-com-rewrite
    priority: 1
    service: app-8080
  rewrites-example-com-about:
    listeners:
    - websecure
    match: Host(`rewrites.example.com`) && PathRegexp(`(?i)^/about$`)
    max_body: 10000000B
    middlewares:
    - rewrites-example-com-replace-path
    - rewrites-example-com-strip-prefix
    - rewrites-example-com-rewrite
    priority: 2
    service: app-8080
  rewrites-example-com-forbidden:
    enabled: false
    listeners:
    - websecure
    match: Host(`rewrites.example.com`) && PathRegexp(`(?i)^/forbidden/`)
    max_body: 10000000B
    middlewares:
    - rewrites-example-com-strip-prefix
    - rewrites-example-com-rewrite
    priority: 4
    service: respond-403
  rewrites-example-com-hello:
    enabled: false
    listeners:
    - websecure
    match: Host(`rewrites.example.com`) && PathRegexp(`(?i)^/hello$`)
    max_body: 10000000B
    middlewares:
    - rewrites-example-com-strip-prefix
    - rewrites-example-com-rewrite
    priority: 3
    service: rewrites-example-com-hello-unmigrated
services:
  app-8080:
    backends:
    - address: app:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
  respond-403:
    respond:
      status: 403
  rewrites-example-com-hello-unmigrated:
    respond:
      status: 200
