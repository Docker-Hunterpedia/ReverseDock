# Generated by `rdock migrate caddy` from caddy.json: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 4 source item(s): 4 exact, 0 approximate, 0 manual, 0 dropped; 3 finding(s) about the result
# To review (1):
#   - [caddy.default.response_timeout] result: Caddy waits for a backend's answer without a time limit by default; ReverseDock's `timeouts.read` is 60s between two reads (raise it on services with slow answers)
middlewares:
  www-example-org-headers:
    request:
      set:
        X-App-Name: shop
    response:
      remove:
      - Server
    type: headers
routes:
  www-example-org:
    listeners:
    - websecure
    match: Host(`www.example.org`)
    middlewares:
    - www-example-org-headers
    priority: 1
    service: web-a-80
services:
  web-a-80:
    backends:
    - address: web-a:80
    - address: web-b:80
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
