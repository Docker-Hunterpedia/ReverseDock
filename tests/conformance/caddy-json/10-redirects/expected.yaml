# Generated by `rdock migrate caddy` from caddy.json: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 9 source item(s): 9 exact, 0 approximate, 0 manual, 0 dropped; 2 finding(s) about the result
# To review (1):
#   - [caddy.default.response_timeout] result: Caddy waits for a backend's answer without a time limit by default; ReverseDock's `timeouts.read` is 60s between two reads (raise it on services with slow answers)
middlewares:
  example-com-redirect:
    regex: ^(?P<s>[a-z]+)://(?P<h>[^/]+)
    replacement: https://blog.example.com/
    status: 302
    type: redirect
  www-example-com-redirect:
    hostname: example.com
    scheme: https
    status: 301
    type: redirect
routes:
  example-com:
    listeners:
    - websecure
    match: Host(`example.com`)
    priority: 1
    service: site-8080
  example-com-old-blog:
    listeners:
    - websecure
    match: Host(`example.com`) && PathRegexp(`(?i)^/old\-blog$`)
    middlewares:
    - example-com-redirect
    priority: 2
    service: not-found
  www-example-com:
    listeners:
    - websecure
    match: Host(`www.example.com`)
    middlewares:
    - www-example-com-redirect
    priority: 3
    service: not-found
services:
  not-found:
    respond:
      status: 404
  site-8080:
    backends:
    - address: site:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
