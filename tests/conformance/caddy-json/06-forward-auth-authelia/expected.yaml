# Generated by `rdock migrate caddy` from caddy.json: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 5 source item(s): 4 exact, 1 approximate, 0 manual, 0 dropped; 2 finding(s) about the result
# To review (2):
#   - [caddy.handler.approximate] caddy.json: srv0: key /apps/http/servers/srv0/routes/0/handle/0/routes/0/handle/0 → services: the expanded `forward_auth` directive → a `forward_auth` middleware asking `http://authelia:9091/api/authz/forward-auth`; the authentication service gets `Host` set to its own address (Caddy passes the client's) and no request body
#   - [caddy.default.response_timeout] result: Caddy waits for a backend's answer without a time limit by default; ReverseDock's `timeouts.read` is 60s between two reads (raise it on services with slow answers)
middlewares:
  app-example-net-forward-auth:
    address: http://authelia:9091/api/authz/forward-auth
    copy_headers:
    - Remote-Groups
    - Remote-User
    type: forward_auth
routes:
  app-example-net:
    listeners:
    - websecure
    match: Host(`app.example.net`)
    middlewares:
    - app-example-net-forward-auth
    priority: 1
    service: app-8080
services:
  app-8080:
    backends:
    - address: app:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
