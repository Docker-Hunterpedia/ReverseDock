# 6 source item(s): 4 exact, 2 approximate, 0 manual, 0 dropped
# To review (2):
#   - [caddy.handler.approximate] caddy.json: srv0: key /apps/http/servers/srv0/routes/0/handle/0/routes/0/handle/1: written as `compress`: Caddy's default content types and its level settings differ from ReverseDock's (content types are matched by prefix)
#   - [caddy.handler.approximate] caddy.json: srv0: key /apps/http/servers/srv0/routes/0/handle/0/routes/0/handle/2: `file_server` → a `static` middleware; ReverseDock does not serve files and directories whose name starts with `.` (Caddy serves them unless hidden)
middlewares:
  docs-example-com-compress:
    algorithms:
    - zstd
    - gzip
    min_size: 512B
    type: compress
  docs-example-com-static:
    index:
    - index.html
    - index.txt
    precompressed: []
    root: /srv/docs
    type: static
routes:
  docs-example-com:
    listeners:
    - websecure
    match: Host(`docs.example.com`)
    middlewares:
    - docs-example-com-compress
    - docs-example-com-static
    priority: 1
