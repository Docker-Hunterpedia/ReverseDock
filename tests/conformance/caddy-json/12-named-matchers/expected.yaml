routes:
  api-example-org:
    listeners:
    - websecure
    match: >-
      Host(`api.example.org`) && (Method(`POST`) || Method(`PUT`) ||
      Method(`DELETE`)) && !ClientIP(`10.0.0.0/8`)
    priority: 5
    service: respond-403
  api-example-org-2:
    listeners:
    - websecure
    match: Host(`api.example.org`) && PathRegexp(`^/v0/(.*)$`)
    priority: 4
    service: respond-410
  api-example-org-3:
    listeners:
    - websecure
    match: Host(`api.example.org`) && Header(`X-Beta`, `true`)
    priority: 3
    service: beta-8080
  api-example-org-4:
    enabled: false
    listeners:
    - websecure
    match: Host(`api.example.org`)
    priority: 2
    service: debug-8080
  api-example-org-5:
    enabled: false
    listeners:
    - websecure
    match: Host(`api.example.org`)
    priority: 1
    service: stable-8080
services:
  beta-8080:
    backends:
    - address: beta:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
  debug-8080:
    backends:
    - address: debug:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
  respond-403:
    respond:
      status: 403
  respond-410:
    respond:
      status: 410
  stable-8080:
    backends:
    - address: stable:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
