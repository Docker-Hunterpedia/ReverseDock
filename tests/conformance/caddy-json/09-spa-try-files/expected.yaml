#   - [caddy.handler.approximate] caddy.json: srv0: key /apps/http/servers/srv0/routes/0/handle/0/routes/2/handle/0/routes/0/handle/0: part of the `try_files` idiom (see its matcher)
#   - [caddy.handler.approximate] caddy.json: srv0: key /apps/http/servers/srv0/routes/0/handle/0/routes/2/handle/0/routes/1/handle/0: `file_server` → a `static` middleware; ReverseDock does not serve files and directories whose name starts with `.` (Caddy serves them unless hidden)
#   - [caddy.default.response_timeout] result: Caddy waits for a backend's answer without a time limit by default; ReverseDock's `timeouts.read` is 60s between two reads (raise it on services with slow answers)
middlewares:
  app-example-dev-static:
    fallback: /index.html
    index:
    - index.html
    - index.txt
    precompressed: []
    root: /srv/app
    type: static
routes:
  app-example-dev:
    listeners:
    - websecure
    match: Host(`app.example.dev`)
    middlewares:
    - app-example-dev-static
    priority: 1
  app-example-dev-api:
    listeners:
    - websecure
    match: Host(`app.example.dev`) && PathRegexp(`(?i)^/api/`)
    priority: 2
    service: api-4000
services:
  api-4000:
    backends:
    - address: api:4000
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
