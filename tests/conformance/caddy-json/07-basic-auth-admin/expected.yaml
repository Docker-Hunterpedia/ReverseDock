middlewares:
  admin-example-com-auth:
    realm: restricted
    type: basic_auth
    users:
    - admin:$2a$14$rdockExampleSaltValue.uKQ1v6JqgM2v0pZbxJm3Gq7Vb9Yh2xW
routes:
  admin-example-com:
    listeners:
    - websecure
    match: Host(`admin.example.com`) && !PathRegexp(`(?i)^/admin/`)
    priority: 1
    service: dashboard-8000
  admin-example-com-admin:
    listeners:
    - websecure
    match: Host(`admin.example.com`) && PathRegexp(`(?i)^/admin/`)
    middlewares:
    - admin-example-com-auth
    priority: 2
    service: dashboard-8000
services:
  dashboard-8000:
    backends:
    - address: dashboard:8000
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
