routes:
  plugins-example-com:
    enabled: false
    listeners:
    - websecure
    match: Host(`plugins.example.com`) && !PathRegexp(`(?i)^/metrics$`)
    priority: 1
    service: app-8080
  plugins-example-com-metrics:
    enabled: false
    listeners:
    - websecure
    match: Host(`plugins.example.com`) && PathRegexp(`(?i)^/metrics$`)
    priority: 2
    service: plugins-example-com-metrics-unmigrated
services:
  app-8080:
    backends:
    - address: app:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
  plugins-example-com-metrics-unmigrated:
    respond:
      status: 404
