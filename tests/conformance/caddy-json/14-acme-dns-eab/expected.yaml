# Generated by `rdock migrate caddy` from caddy.json: a complete rdock.yaml. Review before use.
# 8 source item(s): 7 exact, 0 approximate, 1 manual, 0 dropped; 3 finding(s) about the result
# To review (3):
#   - [caddy.tls.credentials] caddy.json: tls: key /apps/tls/automation/policies/0/issuers/0 → acme: DNS-01 with `cloudflare` → `acme.dns_providers.cloudflare` (type `cloudflare`); credentials are never copied: the output reads them from `ACME_EAB_HMAC_KEY` (security-relevant)
#   - [caddy.default.response_timeout] result: Caddy waits for a backend's answer without a time limit by default; ReverseDock's `timeouts.read` is 60s between two reads (raise it on services with slow answers)
#   - [caddy.route.unanswered] result: requests that no handler answers (for example a path a site does not handle) get an empty `200` from Caddy; ReverseDock answers `404`
acme:
  ca: zerossl
  dns_provider: cloudflare
  dns_providers:
    cloudflare:
      api_token: ${env:CF_API_TOKEN}
      type: cloudflare
  eab:
    hmac_key: ${env:ACME_EAB_HMAC_KEY}
    key_id: example-key-id
  email: ops@example.com
listeners:
  web:
    address: ":80"
  websecure:
    address: ":443"
    tls: {}
routes:
  wildcard-example-com:
    listeners:
    - websecure
    match: Host(`*.example.com`) && Host(`app.example.com`)
    priority: 1
    service: app-8080
services:
  app-8080:
    backends:
    - address: app:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
