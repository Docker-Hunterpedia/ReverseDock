# Generated by `rdock migrate caddy` from caddy.json: a complete rdock.yaml. Review before use.
# 12 source item(s): 11 exact, 1 approximate, 0 manual, 0 dropped; 2 finding(s) about the result
# To review (2):
#   - [caddy.server.approximate] caddy.json: srv0: key /apps/http/servers/srv0/tls_connection_policies/0 → listeners: routes for secure.example.com use `certificates.cert0` (`tls.certificate`); matched by server name; TLS 1.3 only → `tls.policy: modern` on the whole listener, also for the names of other connection policies
#   - [caddy.default.response_timeout] result: Caddy waits for a backend's answer without a time limit by default; ReverseDock's `timeouts.read` is 60s between two reads (raise it on services with slow answers)
certificates:
  cert0:
    cert_file: /etc/ssl/secure.pem
    key_file: /etc/ssl/secure.key
listeners:
  web:
    address: ":80"
  websecure:
    address: ":443"
    tls:
      policy: modern
routes:
  dev-localhost:
    listeners:
    - websecure
    match: Host(`dev.localhost`)
    priority: 1
    service: devapp-3000
  secure-example-com:
    listeners:
    - websecure
    match: Host(`secure.example.com`)
    priority: 2
    service: secure-app-8080
    tls:
      certificate: cert0
services:
  devapp-3000:
    backends:
    - address: devapp:3000
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
  secure-app-8080:
    backends:
    - address: secure-app:8080
    load_balancer:
      policy: random
    timeouts:
      connect: 3s
