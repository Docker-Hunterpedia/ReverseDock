# Generated by `rdock migrate caddy` from caddy.json: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 4 source item(s): 3 exact, 1 approximate, 0 manual, 0 dropped
# To review (1):
#   - [caddy.handler.approximate] caddy.json: srv0: key /apps/http/servers/srv0/routes/0/handle/0/routes/0/handle/0 → services: `response_header_timeout` → `timeouts.read: 30s`, which also bounds each wait for response data; retrying another upstream → `retries: { attempts: 2, on: [connect] }`; Caddy's time-bounded retrying (`try_duration`, `try_interval`) has no equivalent; active health checks with Caddy's defaults written explicitly (30s, 5s, one pass, one failure); passive health checks: 3 failure(s) within 30s eject a backend for 30s; ReverseDock doubles the ejection for each ejection in a row and never ejects more than half the pool; `reverse_proxy` → a service
routes:
  shop-example-com:
    listeners:
    - websecure
    match: Host(`shop.example.com`)
    priority: 1
    service: shop-1-3000
services:
  shop-1-3000:
    backends:
    - address: shop-1:3000
    - address: shop-2:3000
    health:
      active:
        expected_status: "200"
        healthy: 1
        interval: 10s
        path: /healthz
        timeout: 2s
        unhealthy: 1
      passive:
        ejection: 30s
        failures: 3
        window: 30s
    load_balancer:
      policy: least_conn
    retries:
      attempts: 2
      "on":
      - connect
    timeouts:
      connect: 2s
      read: 30s
