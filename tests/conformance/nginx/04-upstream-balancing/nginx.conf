# Exercises: upstream blocks: weights, backup, down, max_fails/fail_timeout, least_conn, ip_hash, hash on a cookie, keepalive.
http {
    upstream app {
        least_conn;
        server 10.0.0.11:8080 weight=3;
        server 10.0.0.12:8080 max_fails=2 fail_timeout=30s;
        server 10.0.0.13:8080 backup;
        server 10.0.0.14:8080 down;
        keepalive 16;
    }
    upstream sticky {
        ip_hash;
        server 10.0.1.1:9000;
        server 10.0.1.2:9000;
    }
    upstream session {
        hash $cookie_sessionid consistent;
        server 10.0.2.1:9000;
        server 10.0.2.2:9000;
    }
    upstream single {
        server single.internal;
    }

    server {
        listen 80;
        server_name lb.example.com;
        location / { proxy_pass http://app; }
        location /sticky/ { proxy_pass http://sticky; }
        location /session/ { proxy_pass http://session; }
        location /single/ { proxy_pass http://single; }
    }
}
