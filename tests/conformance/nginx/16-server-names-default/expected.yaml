routes:
  default-return:
    listeners:
    - web
    match: "!(Host(`example.com`) || Host(`www.example.com`) || HostRegexp(`(?i)^.+\\.example\\.com$`) || Host(`example.org`) || HostRegexp(`(?i)^.+\\.example\\.org$`) || HostRegexp(`(?i)^mail\\..+$`))"
    priority: 7000000
    service: respond-404
    tls: "off"
  example-com-root:
    listeners:
    - web
    match: (Host(`example.com`) || Host(`www.example.com`)) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: main-80
    timeouts:
      connect: 1m
    tls: "off"
  example-org-root:
    listeners:
    - web
    match: (Host(`example.org`) || HostRegexp(`(?i)^.+\.example\.org$`)) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: org-80
    timeouts:
      connect: 1m
    tls: "off"
  mail-wildcard-root:
    listeners:
    - web
    match: HostRegexp(`(?i)^mail\..+$`) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: mail-80
    timeouts:
      connect: 1m
    tls: "off"
  user-users-example-net-root:
    enabled: false
    listeners:
    - web
    match: HostRegexp(`(?i)^(?<user>.+)\.users\.example\.net$`) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: users-80
    timeouts:
      connect: 1m
    tls: "off"
  wildcard-example-com-root:
    listeners:
    - web
    match: >-
      HostRegexp(`(?i)^.+\.example\.com$`) && !(Host(`www.example.com`)) &&
      PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: tenants-80
    timeouts:
      connect: 1m
    tls: "off"
services:
  mail-80:
    backends:
    - address: mail:80
    pass_host_header: false
  main-80:
    backends:
    - address: main:80
    pass_host_header: false
  org-80:
    backends:
    - address: org:80
    pass_host_header: false
  respond-404:
    respond:
      status: 404
  tenants-80:
    backends:
    - address: tenants:80
    pass_host_header: false
  users-80:
