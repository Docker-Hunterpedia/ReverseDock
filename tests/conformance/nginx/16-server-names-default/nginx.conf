# Exercises: several servers on one listener: exact, leading and trailing wildcards, .example.com, a default_server catch-all, a regex name (manual).
http {
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 80;
        server_name example.com www.example.com;
        location / { proxy_pass http://main:80; }
    }
    server {
        listen 80;
        server_name *.example.com;
        location / { proxy_pass http://tenants:80; }
    }
    server {
        listen 80;
        server_name .example.org;
        location / { proxy_pass http://org:80; }
    }
    server {
        listen 80;
        server_name mail.*;
        location / { proxy_pass http://mail:80; }
    }
    server {
        listen 80;
        server_name ~^(?<user>.+)\.users\.example\.net$;
        location / { proxy_pass http://users:80; }
    }
}
