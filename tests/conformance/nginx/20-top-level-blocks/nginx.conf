# Exercises: process directives, events, stream and mail blocks (refused), error_log, an unknown directive.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    server {
        listen 5432;
        proxy_pass db:5432;
    }
}

mail {
    server {
        listen 25;
        protocol smtp;
    }
}

http {
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    unknown_module_directive on;
    server {
        listen 80;
        server_name top.example.com;
        location / { proxy_pass http://top:80; }
    }
}
