# Generated by `rdock migrate nginx` from nginx.conf: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 20 source item(s): 19 exact, 1 approximate, 0 manual, 0 dropped; 3 finding(s) about the result
# To review (4):
#   - [nginx.directive.approximate] nginx.conf:4: directive gzip on: → `compress` with gzip; NGINX decides on `Content-Length` only and skips proxied requests (`gzip_proxied off`), ReverseDock compresses any matching answer
#   - [nginx.default.buffering] result: NGINX buffers requests and responses by default (`proxy_buffering on`, `proxy_request_buffering on`), which protects backends from slow clients; ReverseDock streams both
#   - [nginx.default.proxy_redirect] result: NGINX rewrites `Location` and `Refresh` headers of backend redirects that point at the `proxy_pass` address (`proxy_redirect default`); ReverseDock passes them unchanged, so a backend that redirects to its own address must use relative or public URLs
#   - [nginx.default.unmatched_host] result: requests for hosts no `server_name` lists go to the default server of their listener in NGINX; the migrated routes keep the default server's names, so ReverseDock answers such requests with 404 (add a catch-all route if they mattered)
middlewares:
  media-example-com-compress:
    algorithms:
    - gzip
    content_types:
    - text/html
    - text/css
    - application/javascript
    - application/json
    min_size: 1000B
    type: compress
  media-example-com-slash:
    path: /upload/
    status: 301
    type: redirect
  media-example-com-slash-2:
    path: /stream/
    status: 301
    type: redirect
routes:
  media-example-com-root:
    listeners:
    - web
    match: Host(`media.example.com`) && PathPrefix(`/`)
    max_body: 50MiB
    middlewares:
    - media-example-com-compress
    priority: 2000010
    service: media-8080
    timeouts:
      connect: 10s
    tls: "off"
  media-example-com-stream:
    listeners:
    - web
    match: Host(`media.example.com`) && PathPrefix(`/stream/`)
    max_body: 50MiB
    middlewares:
    - media-example-com-compress
    priority: 2000080
    service: media-8080
    timeouts:
      connect: 10s
      read: 5m
      write: 5m
    tls: "off"
  media-example-com-stream-slash:
    listeners:
    - web
    match: Host(`media.example.com`) && Path(`/stream`)
    middlewares:
    - media-example-com-slash-2
    priority: 5000000
    service: not-found
    tls: "off"
  media-example-com-upload:
    listeners:
    - web
    match: Host(`media.example.com`) && PathPrefix(`/upload/`)
    middlewares:
    - media-example-com-compress
    priority: 2000080
    service: media-8080
    timeouts:
      connect: 10s
    tls: "off"
  media-example-com-upload-slash:
    listeners:
    - web
    match: Host(`media.example.com`) && Path(`/upload`)
    middlewares:
    - media-example-com-slash
    priority: 5000000
    service: not-found
    tls: "off"
services:
  media-8080:
    backends:
    - address: media:8080
    pass_host_header: false
  not-found:
    respond:
      status: 404
