# Generated by `rdock migrate nginx` from site.conf: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 8 source item(s): 7 exact, 1 approximate, 0 manual, 0 dropped; 7 finding(s) about the result
# To review (6):
#   - [nginx.directive.approximate] site.conf:10: directive proxy_pass http://api/: the `upstream api` block → its service; `/v1/` is replaced by `/` (`strip_prefix`); `Host` is NGINX's default `$proxy_host`, here the upstream name `api`; ReverseDock sends the backend's address (`pass_host_header: false`)
#   - [nginx.default.buffering] result: NGINX buffers requests and responses by default (`proxy_buffering on`, `proxy_request_buffering on`), which protects backends from slow clients; ReverseDock streams both
#   - [nginx.default.next_upstream] result: NGINX passes a request to the next upstream server after a connection error or timeout (`proxy_next_upstream error timeout`): written as `retries` on services with several backends
#   - [nginx.default.passive_health] result: NGINX marks an upstream server unavailable after one failure for 10s by default (`max_fails=1 fail_timeout=10s`): written as `health.passive` on services with several backends; ReverseDock doubles the ejection for repeated failures and never ejects more than half the pool
#   - [nginx.default.proxy_redirect] result: NGINX rewrites `Location` and `Refresh` headers of backend redirects that point at the `proxy_pass` address (`proxy_redirect default`); ReverseDock passes them unchanged, so a backend that redirects to its own address must use relative or public URLs
#   - [nginx.default.unmatched_host] result: requests for hosts no `server_name` lists go to the default server of their listener in NGINX; the migrated routes keep the default server's names, so ReverseDock answers such requests with 404 (add a catch-all route if they mattered)
middlewares:
  api-example-com-path:
    prefixes:
    - /v1/
    type: strip_prefix
  api-example-com-slash:
    path: /v1/
    status: 301
    type: redirect
routes:
  api-example-com-v1:
    listeners:
    - http-8080
    match: Host(`api.example.com`) && PathPrefix(`/v1/`)
    max_body: 1MiB
    middlewares:
    - api-example-com-path
    priority: 2000040
    service: api
    timeouts:
      connect: 1m
    tls: "off"
  api-example-com-v1-slash:
    listeners:
    - http-8080
    match: Host(`api.example.com`) && Path(`/v1`)
    middlewares:
    - api-example-com-slash
    priority: 5000000
    service: not-found
    tls: "off"
services:
  api:
    backends:
    - address: api-1:8000
    - address: api-2:8000
    health:
      passive:
        ejection: 10s
        failures: 1
        window: 10s
    pass_host_header: false
    retries:
      attempts: 1
      "on":
      - connect
      - timeout
  not-found:
    respond:
      status: 404
