# Exercises: auth_basic with a user file (never read), allow/deny pure forms, a mixed list (manual), auth_basic off in a location.
http {
    server {
        listen 80;
        server_name admin.example.com;
        auth_basic "Admin area";
        auth_basic_user_file /etc/nginx/htpasswd;

        location / {
            allow 10.0.0.0/8;
            allow 192.168.1.0/24;
            deny all;
            proxy_pass http://admin:9000;
        }
        location /public/ {
            auth_basic off;
            deny 203.0.113.0/24;
            proxy_pass http://admin:9000;
        }
        location /mixed/ {
            deny 10.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://admin:9000;
        }
    }
}
