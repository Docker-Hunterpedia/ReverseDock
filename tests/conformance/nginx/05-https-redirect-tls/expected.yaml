certificates:
  shop-example-com:
    cert_file: /etc/letsencrypt/live/shop.example.com/fullchain.pem
    key_file: /etc/letsencrypt/live/shop.example.com/privkey.pem
listeners:
  web:
    address: ":80"
  websecure:
    address: ":443"
    tls: {}
routes:
  shop-example-com-root:
    listeners:
    - websecure
    match: (Host(`shop.example.com`) || Host(`www.shop.example.com`)) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: shop-3000
    timeouts:
      connect: 1m
    tls:
      certificate: shop-example-com
services:
  shop-3000:
    backends:
    - address: shop:3000
