# Exercises: try_files $uri @backend with a named location that proxies (static with pass_through then the service).
http {
    server {
        listen 80;
        server_name hybrid.example.com;
        root /srv/public;

        location / {
            try_files $uri @app;
        }
        location @app {
            proxy_pass http://rails:3000;
            proxy_set_header Host $host;
        }
    }
}
