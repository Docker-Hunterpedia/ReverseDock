middlewares:
  ws-example-com-slash:
    path: /socket/
    status: 301
    type: redirect
routes:
  ws-example-com-socket:
    listeners:
    - web
    match: Host(`ws.example.com`) && PathPrefix(`/socket/`)
    max_body: 1MiB
    priority: 2000080
    service: chat-4000
    timeouts:
      connect: 1m
      read: 1h
    tls: "off"
  ws-example-com-socket-slash:
    listeners:
    - web
    match: Host(`ws.example.com`) && Path(`/socket`)
    middlewares:
    - ws-example-com-slash
    priority: 5000000
    service: not-found
    tls: "off"
services:
  chat-4000:
    backends:
    - address: chat:4000
  not-found:
    respond:
      status: 404
