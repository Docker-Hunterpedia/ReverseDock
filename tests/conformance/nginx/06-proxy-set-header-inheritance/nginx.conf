# Exercises: proxy_set_header all-or-nothing inheritance: a location with its own proxy_set_header loses the server's, including Host.
http {
    proxy_set_header X-Env production;
    server {
        listen 80;
        server_name inherit.example.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        location / {
            proxy_pass http://web:8000;
        }
        location /api/ {
            proxy_set_header X-Api-Version 2;
            proxy_pass http://api:8000;
        }
        location /plain/ {
            proxy_pass http://plain:8000;
            proxy_set_header Accept-Encoding "";
        }
    }
}
