middlewares:
  inherit-example-com-headers-up:
    request:
      set:
        X-Api-Version: "2"
    type: headers
  inherit-example-com-headers-up-2:
    request:
      remove:
      - Accept-Encoding
    type: headers
  inherit-example-com-slash:
    path: /api/
    status: 301
    type: redirect
  inherit-example-com-slash-2:
    path: /plain/
    status: 301
    type: redirect
routes:
  inherit-example-com-api:
    listeners:
    - web
    match: Host(`inherit.example.com`) && PathPrefix(`/api/`)
    max_body: 1MiB
    middlewares:
    - inherit-example-com-headers-up
    priority: 2000050
    service: api-8000
    timeouts:
      connect: 1m
    tls: "off"
  inherit-example-com-api-slash:
    listeners:
    - web
    match: Host(`inherit.example.com`) && Path(`/api`)
    middlewares:
    - inherit-example-com-slash
    priority: 5000000
    service: not-found
    tls: "off"
  inherit-example-com-plain:
    listeners:
    - web
    match: Host(`inherit.example.com`) && PathPrefix(`/plain/`)
    max_body: 1MiB
    middlewares:
    - inherit-example-com-headers-up-2
    priority: 2000070
    service: plain-8000
    timeouts:
      connect: 1m
    tls: "off"
  inherit-example-com-plain-slash:
    listeners:
    - web
    match: Host(`inherit.example.com`) && Path(`/plain`)
    middlewares:
    - inherit-example-com-slash-2
    priority: 5000000
    service: not-found
    tls: "off"
  inherit-example-com-root:
    listeners:
    - web
    match: Host(`inherit.example.com`) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: web-8000
    timeouts:
      connect: 1m
    tls: "off"
services:
  api-8000:
    backends:
    - address: api:8000
    pass_host_header: false
  not-found:
    respond:
      status: 404
  plain-8000:
    backends:
    - address: plain:8000
    pass_host_header: false
  web-8000:
