# 11 source item(s): 10 exact, 1 approximate, 0 manual, 0 dropped; 5 finding(s) about the result
# To review (4):
#   - [nginx.directive.approximate] nginx.conf:13: directive add_header X-Embed yes: → `headers.response.add`; ReverseDock adds it to every answer, NGINX only to 200, 201, 204, 206, 301, 302, 303, 304, 307 and 308 without `always`
#   - [nginx.default.buffering] result: NGINX buffers requests and responses by default (`proxy_buffering on`, `proxy_request_buffering on`), which protects backends from slow clients; ReverseDock streams both
#   - [nginx.default.proxy_redirect] result: NGINX rewrites `Location` and `Refresh` headers of backend redirects that point at the `proxy_pass` address (`proxy_redirect default`); ReverseDock passes them unchanged, so a backend that redirects to its own address must use relative or public URLs
#   - [nginx.default.unmatched_host] result: requests for hosts no `server_name` lists go to the default server of their listener in NGINX; the migrated routes keep the default server's names, so ReverseDock answers such requests with 404 (add a catch-all route if they mattered)
middlewares:
  headers-example-com-headers:
    response:
      add:
        Strict-Transport-Security: max-age=31536000
        X-Frame-Options: DENY
    type: headers
  headers-example-com-headers-2:
    response:
      add:
        X-Embed: "yes"
    type: headers
  headers-example-com-slash:
    path: /embed/
    status: 301
    type: redirect
routes:
  headers-example-com-embed:
    listeners:
    - web
    match: Host(`headers.example.com`) && PathPrefix(`/embed/`)
    max_body: 1MiB
    middlewares:
    - headers-example-com-headers-2
    priority: 2000070
    service: site-8080
    timeouts:
      connect: 1m
    tls: "off"
  headers-example-com-embed-slash:
    listeners:
    - web
    match: Host(`headers.example.com`) && Path(`/embed`)
    middlewares:
    - headers-example-com-slash
    priority: 5000000
    service: not-found
    tls: "off"
  headers-example-com-root:
    listeners:
    - web
    match: Host(`headers.example.com`) && PathPrefix(`/`)
    max_body: 1MiB
    middlewares:
    - headers-example-com-headers
    priority: 2000010
    service: site-8080
    timeouts:
      connect: 1m
    tls: "off"
services:
  not-found:
    respond:
      status: 404
  site-8080:
    backends:
    - address: site:8080
    pass_host_header: false
