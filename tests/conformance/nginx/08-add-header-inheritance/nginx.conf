# Exercises: add_header inheritance (a location with its own add_header loses the server's), always, and without always (approximate).
http {
    server {
        listen 80;
        server_name headers.example.com;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass http://site:8080;
        }
        location /embed/ {
            add_header X-Embed yes;
            proxy_pass http://site:8080;
        }
    }
}
