# Exercises: grpc_pass to an h2c backend, proxy_pass to a Unix socket with a URI.
http {
    server {
        listen 443 ssl;
        http2 on;
        server_name grpc.example.com;
        ssl_certificate /etc/ssl/grpc/fullchain.pem;
        ssl_certificate_key /etc/ssl/grpc/privkey.pem;
        location /helloworld.Greeter/ {
            grpc_pass grpc://greeter:50051;
        }
        location /api/ {
            proxy_pass http://unix:/run/app/app.sock:/v2/;
        }
    }
}
