# Generated by `rdock migrate nginx` from nginx.conf: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 11 source item(s): 11 exact, 0 approximate, 0 manual, 0 dropped; 5 finding(s) about the result
# To review (3):
#   - [nginx.default.buffering] result: NGINX buffers requests and responses by default (`proxy_buffering on`, `proxy_request_buffering on`), which protects backends from slow clients; ReverseDock streams both
#   - [nginx.default.proxy_redirect] result: NGINX rewrites `Location` and `Refresh` headers of backend redirects that point at the `proxy_pass` address (`proxy_redirect default`); ReverseDock passes them unchanged, so a backend that redirects to its own address must use relative or public URLs
#   - [nginx.default.unmatched_host] result: requests for hosts no `server_name` lists go to the default server of their listener in NGINX; the migrated routes keep the default server's names, so ReverseDock answers such requests with 404 (add a catch-all route if they mattered)
certificates:
  grpc:
    cert_file: /etc/ssl/grpc/fullchain.pem
    key_file: /etc/ssl/grpc/privkey.pem
middlewares:
  grpc-example-com-path:
    regex: ^/api/(.*)$
    replacement: /v2/${1}
    type: rewrite
  grpc-example-com-slash:
    path: /helloworld.Greeter/
    status: 301
    type: redirect
  grpc-example-com-slash-2:
    path: /api/
    status: 301
    type: redirect
routes:
  grpc-example-com-api:
    listeners:
    - websecure
    match: Host(`grpc.example.com`) && PathPrefix(`/api/`)
    max_body: 1MiB
    middlewares:
    - grpc-example-com-path
    priority: 2000050
    service: unix-run-app-app-sock
    timeouts:
      connect: 1m
    tls:
      certificate: grpc
  grpc-example-com-api-slash:
    listeners:
    - websecure
    match: Host(`grpc.example.com`) && Path(`/api`)
    middlewares:
    - grpc-example-com-slash-2
    priority: 5000000
    service: not-found
    tls:
      certificate: grpc
  grpc-example-com-helloworld-greeter:
    listeners:
    - websecure
    match: Host(`grpc.example.com`) && PathPrefix(`/helloworld.Greeter/`)
    max_body: 1MiB
    priority: 2000200
    service: greeter-50051
    timeouts:
      connect: 1m
    tls:
      certificate: grpc
  grpc-example-com-helloworld-greeter-slash:
    listeners:
    - websecure
    match: Host(`grpc.example.com`) && Path(`/helloworld.Greeter`)
    middlewares:
    - grpc-example-com-slash
    priority: 5000000
    service: not-found
    tls:
      certificate: grpc
services:
  greeter-50051:
    backends:
    - address: greeter:50051
    pass_host_header: false
    scheme: h2c
  not-found:
    respond:
      status: 404
  unix-run-app-app-sock:
    backends:
    - address: unix:///run/app/app.sock
    pass_host_header: false
