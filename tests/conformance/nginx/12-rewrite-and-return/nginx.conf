# Exercises: rewrite permanent/redirect/break, rewrite last (refused), return with a URL, a status, and a body (manual).
http {
    server {
        listen 80;
        server_name rewrite.example.com;
        rewrite ^/old-blog/(.*)$ /blog/$1 permanent;

        location /blog/ {
            rewrite ^/blog/legacy/(.*)$ https://archive.example.com/$1 redirect;
            proxy_pass http://blog:2368;
        }
        location /app/ {
            rewrite ^/app/(.*)$ /$1 break;
            proxy_pass http://app:8080/ignored/;
        }
        location /moved {
            return 301 https://new.example.com$request_uri;
        }
        location = /gone {
            return 410;
        }
        location = /hello {
            return 200 "hello";
        }
        location /loop/ {
            rewrite ^/loop/(.*)$ /blog/$1 last;
        }
    }
}
