# Generated by `rdock migrate nginx` from nginx.conf: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 19 source item(s): 17 exact, 0 approximate, 2 manual, 0 dropped; 7 finding(s) about the result
# To review (7):
#   - [nginx.directive.manual] nginx.conf:23: directive return 200 "hello": `return 200` with a body (`hello`) has no equivalent (a fixed-status service answers without a body)
#   - [nginx.refused] nginx.conf:26: directive rewrite ^/loop/(.*)$ /blog/$1 last: a `rewrite` that re-runs location matching (`last`, no flag) or a second `rewrite … break` has no faithful translation: ReverseDock picks a route once
#   - [nginx.default.buffering] result: NGINX buffers requests and responses by default (`proxy_buffering on`, `proxy_request_buffering on`), which protects backends from slow clients; ReverseDock streams both
#   - [nginx.default.proxy_redirect] result: NGINX rewrites `Location` and `Refresh` headers of backend redirects that point at the `proxy_pass` address (`proxy_redirect default`); ReverseDock passes them unchanged, so a backend that redirects to its own address must use relative or public URLs
#   - [nginx.default.unmatched_host] result: requests for hosts no `server_name` lists go to the default server of their listener in NGINX; the migrated routes keep the default server's names, so ReverseDock answers such requests with 404 (add a catch-all route if they mattered)
#   - [nginx.route.disabled] result → routes.rewrite-example-com-hello: route `rewrite-example-com-hello` is written disabled (`enabled: false`): a `return` with a body has no equivalent (security-relevant)
#   - [nginx.route.disabled] result → routes.rewrite-example-com-loop: route `rewrite-example-com-loop` is written disabled (`enabled: false`): a `rewrite` was not migrated; no `root`: NGINX would serve its default `html` directory (security-relevant)
middlewares:
  rewrite-example-com-redirect:
    regex: >-
      ^(?P<rdocks>[a-z][a-z0-9+.-]*)://(?P<rdocka>(?P<rdockh>[^/:?]+)(?::[0-9]+)?)(?:/old-blog/([^?]*))(?P<rdockq>\?.*)?$
    replacement: ${rdocks}://${rdocka}/blog/${4}${rdockq}
    status: 301
    type: redirect
  rewrite-example-com-redirect-2:
    regex: >-
      ^(?P<rdocks>[a-z][a-z0-9+.-]*)://(?P<rdocka>(?P<rdockh>[^/:?]+)(?::[0-9]+)?)(?:/blog/legacy/([^?]*))(?P<rdockq>\?.*)?$
    replacement: https://archive.example.com/${4}${rdockq}
    status: 302
    type: redirect
  rewrite-example-com-redirect-3:
    hostname: new.example.com
    scheme: https
    status: 301
    type: redirect
  rewrite-example-com-rewrite:
    regex: ^(?:/app/(.*))$
    replacement: /${1}
    type: rewrite
  rewrite-example-com-slash:
    path: /blog/
    status: 301
    type: redirect
  rewrite-example-com-slash-2:
    path: /app/
    status: 301
    type: redirect
  rewrite-example-com-static:
    index:
    - index.html
    precompressed: []
    root: html
    type: static
routes:
  rewrite-example-com-app:
    listeners:
    - web
    match: Host(`rewrite.example.com`) && PathPrefix(`/app/`)
    max_body: 1MiB
    middlewares:
    - rewrite-example-com-rewrite
    priority: 2000050
    service: app-8080
    timeouts:
      connect: 1m
    tls: "off"
  rewrite-example-com-app-slash:
    listeners:
    - web
    match: Host(`rewrite.example.com`) && Path(`/app`)
    middlewares:
    - rewrite-example-com-slash-2
    priority: 5000000
    service: not-found
    tls: "off"
  rewrite-example-com-blog:
    listeners:
    - web
    match: Host(`rewrite.example.com`) && PathPrefix(`/blog/`)
    max_body: 1MiB
    priority: 2000060
    service: blog-2368
    timeouts:
      connect: 1m
    tls: "off"
  rewrite-example-com-blog-slash:
    listeners:
    - web
    match: Host(`rewrite.example.com`) && Path(`/blog`)
    middlewares:
    - rewrite-example-com-slash
    priority: 5000000
    service: not-found
    tls: "off"
  rewrite-example-com-gone:
    listeners:
    - web
    match: Host(`rewrite.example.com`) && Path(`/gone`)
    max_body: 1MiB
    priority: 5000000
    service: respond-410
    tls: "off"
  rewrite-example-com-hello:
    enabled: false
    listeners:
    - web
    match: Host(`rewrite.example.com`) && Path(`/hello`)
    max_body: 1MiB
    priority: 5000000
    service: respond-200
    tls: "off"
  rewrite-example-com-loop:
    enabled: false
    listeners:
    - web
    match: Host(`rewrite.example.com`) && PathPrefix(`/loop/`)
    max_body: 1MiB
    middlewares:
    - rewrite-example-com-static
    priority: 2000060
    tls: "off"
  rewrite-example-com-moved:
    listeners:
    - web
    match: Host(`rewrite.example.com`) && PathPrefix(`/moved`)
    max_body: 1MiB
    middlewares:
    - rewrite-example-com-redirect-3
    priority: 2000060
    service: not-found
    tls: "off"
  rewrite-example-com-rewrite:
    listeners:
    - web
    match: Host(`rewrite.example.com`) && PathRegexp(`^/old-blog/(.*)$`)
    middlewares:
    - rewrite-example-com-redirect
    priority: 6000001
    service: not-found
    tls: "off"
  rewrite-example-com-rewrite-2:
    listeners:
    - web
    match: >-
      Host(`rewrite.example.com`) && PathPrefix(`/blog/`) &&
      PathRegexp(`^/blog/legacy/(.*)$`)
    middlewares:
    - rewrite-example-com-redirect-2
    priority: 2000068
    service: not-found
    tls: "off"
services:
  app-8080:
    backends:
    - address: app:8080
    pass_host_header: false
  blog-2368:
    backends:
    - address: blog:2368
    pass_host_header: false
  not-found:
    respond:
      status: 404
  respond-200:
    respond:
      status: 200
  respond-410:
    respond:
      status: 410
