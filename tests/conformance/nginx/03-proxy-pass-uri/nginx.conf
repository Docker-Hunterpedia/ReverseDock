# Exercises: the four proxy_pass URI cases: no URI, a URI in prefix locations (with and without trailing slashes), a URI in an exact location, a URI in a regex location (refused by NGINX).
http {
    server {
        listen 80;
        server_name paths.example.com;

        location /name/ { proxy_pass http://app:8080/remote/; }
        location /strip/ { proxy_pass http://app:8080/; }
        location /noslash { proxy_pass http://app:8080/; }
        location /join/ { proxy_pass http://app:8080/joined; }
        location / { proxy_pass http://app:8080/base/; }
        location = /exact { proxy_pass http://app:8080/elsewhere; }
        location /asis/ { proxy_pass http://app:8080; }
        location ~ ^/re/ { proxy_pass http://app:8080/regex/; }
    }
}
