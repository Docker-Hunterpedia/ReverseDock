# Exercises: location precedence: exact, ^~, regular expressions in file order, longest prefix.
http {
    server {
        listen 80;
        server_name precedence.example.com;

        location = / { proxy_pass http://exact-root:80; }
        location / { proxy_pass http://catchall:80; }
        location /docs/ { proxy_pass http://docs:80; }
        location /docs/api/ { proxy_pass http://docs-api:80; }
        location ^~ /static/ { proxy_pass http://static:80; }
        location /static/img/ { proxy_pass http://static-img:80; }
        location ~ \.php$ { proxy_pass http://php-like:80; }
        location ~* \.(png|jpe?g)$ { proxy_pass http://images:80; }
        location ~ ^/docs/api/v[0-9]+/ { proxy_pass http://docs-versions:80; }
    }
}
