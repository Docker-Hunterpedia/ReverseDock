# Exercises: constructs refused per construct: if, set, map (not the WebSocket idiom), Lua, fastcgi_pass, auth_request, error_page, proxy_cache, limit_req, sub_filter, an unused named location, a nested location.
http {
    map $http_user_agent $is_bot {
        default 0;
        ~*bot 1;
    }
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
    proxy_cache_path /var/cache/nginx keys_zone=cache:10m;

    server {
        listen 80;
        server_name refused.example.com;

        location / {
            if ($is_bot) {
                return 403;
            }
            set $backend web;
            limit_req zone=perip burst=20 nodelay;
            proxy_cache cache;
            error_page 502 /50x.html;
            proxy_pass http://web:8080;
        }
        location /php/ {
            fastcgi_pass unix:/run/php-fpm.sock;
            include fastcgi_params;
        }
        location /secure/ {
            auth_request /auth;
            proxy_pass http://secure:8080;
        }
        location /lua/ {
            content_by_lua_block {
                ngx.say("hello")
            }
        }
        location /filter/ {
            sub_filter 'http://' 'https://';
            proxy_pass http://filter:8080;
            location /filter/inner/ {
                proxy_pass http://inner:8080;
            }
        }
        location @unused {
            proxy_pass http://unused:8080;
        }
    }
}
