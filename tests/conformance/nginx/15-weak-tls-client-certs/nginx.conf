# Exercises: ssl_protocols with TLSv1/TLSv1.1 (manual, not written), custom ssl_ciphers (approximate), client certificate verification.
http {
    server {
        listen 443 ssl;
        server_name legacy.example.com;
        ssl_certificate /etc/ssl/legacy/cert.pem;
        ssl_certificate_key /etc/ssl/legacy/key.pem;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_client_certificate /etc/ssl/legacy/clients-ca.pem;
        ssl_verify_client on;
        location / { proxy_pass http://legacy:8080; }
    }
}
