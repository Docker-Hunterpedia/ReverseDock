# Generated by `rdock migrate nginx` from nginx.conf: a complete rdock.yaml. Review before use.
# 12 source item(s): 9 exact, 2 approximate, 1 manual, 0 dropped; 5 finding(s) about the result
# To review (6):
#   - [nginx.tls.weak] nginx.conf:8: directive ssl_protocols TLSv1 TLSv1.1 TLSv1.2: `TLSv1`, `TLSv1.1` are weaker than ReverseDock's floor (TLS 1.2) and not written; the listeners keep `intermediate` (security-relevant)
#   - [nginx.directive.approximate] nginx.conf:9: directive ssl_ciphers HIGH:!aNULL:!MD5: cipher lists: TLS settings are two presets here (`intermediate`, `modern`, Mozilla's lists); the listeners keep `intermediate`
#   - [nginx.directive.approximate] nginx.conf:11: directive ssl_verify_client on: client certificates `required` → `tls.client_auth` on the listener (per listener here, per server in NGINX)
#   - [nginx.default.buffering] result: NGINX buffers requests and responses by default (`proxy_buffering on`, `proxy_request_buffering on`), which protects backends from slow clients; ReverseDock streams both
#   - [nginx.default.proxy_redirect] result: NGINX rewrites `Location` and `Refresh` headers of backend redirects that point at the `proxy_pass` address (`proxy_redirect default`); ReverseDock passes them unchanged, so a backend that redirects to its own address must use relative or public URLs
#   - [nginx.default.unmatched_host] result: requests for hosts no `server_name` lists go to the default server of their listener in NGINX; the migrated routes keep the default server's names, so ReverseDock answers such requests with 404 (add a catch-all route if they mattered)
certificates:
  legacy:
    cert_file: /etc/ssl/legacy/cert.pem
    key_file: /etc/ssl/legacy/key.pem
listeners:
  web:
    address: ":80"
  websecure:
    address: ":443"
    tls:
      client_auth:
        ca_files:
        - /etc/ssl/legacy/clients-ca.pem
        mode: required
routes:
  legacy-example-com-root:
    listeners:
    - websecure
    match: Host(`legacy.example.com`) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: legacy-8080
    timeouts:
      connect: 1m
    tls:
      certificate: legacy
services:
  legacy-8080:
    backends:
    - address: legacy:8080
    pass_host_header: false
