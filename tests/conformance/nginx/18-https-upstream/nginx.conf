# Exercises: proxy_pass to HTTPS backends: verification kept on (NGINX's default is off), proxy_ssl_verify on with a CA, proxy_ssl_name.
http {
    server {
        listen 80;
        server_name tls-backend.example.com;
        location / {
            proxy_pass https://secure-backend.internal;
        }
        location /verified/ {
            proxy_pass https://10.0.5.5:8443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/backend-ca.pem;
            proxy_ssl_name backend.internal;
            proxy_ssl_server_name on;
        }
        location /insecure/ {
            proxy_pass https://self-signed.internal:8443;
            proxy_ssl_verify off;
        }
    }
}
