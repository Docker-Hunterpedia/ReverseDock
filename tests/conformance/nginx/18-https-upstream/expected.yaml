middlewares:
  tls-backend-example-com-slash:
    path: /verified/
    status: 301
    type: redirect
  tls-backend-example-com-slash-2:
    path: /insecure/
    status: 301
    type: redirect
routes:
  tls-backend-example-com-insecure:
    listeners:
    - web
    match: Host(`tls-backend.example.com`) && PathPrefix(`/insecure/`)
    max_body: 1MiB
    priority: 2000100
    service: self-signed-internal-8443
    timeouts:
      connect: 1m
    tls: "off"
  tls-backend-example-com-insecure-slash:
    listeners:
    - web
    match: Host(`tls-backend.example.com`) && Path(`/insecure`)
    middlewares:
    - tls-backend-example-com-slash-2
    priority: 5000000
    service: not-found
    tls: "off"
  tls-backend-example-com-root:
    listeners:
    - web
    match: Host(`tls-backend.example.com`) && PathPrefix(`/`)
    max_body: 1MiB
    priority: 2000010
    service: secure-backend-internal-443
    timeouts:
      connect: 1m
