middlewares:
  spa-example-com-alias:
    prefixes:
    - /downloads
    type: strip_prefix
  spa-example-com-static:
    fallback: /index.html
    index:
    - index.html
    precompressed: []
    root: /srv/spa
    type: static
  spa-example-com-static-2:
    cache_control:
      default: max-age=2592000
    index:
    - index.html
    precompressed: []
    root: /srv/spa
    type: static
  spa-example-com-static-3:
    index:
    - index.html
    listing: true
    precompressed: []
    root: /srv/files/
    type: static
routes:
  spa-example-com-assets:
    listeners:
    - web
    match: Host(`spa.example.com`) && PathPrefix(`/assets/`)
    max_body: 1MiB
    middlewares:
    - spa-example-com-static-2
    priority: 2000080
    tls: "off"
  spa-example-com-downloads:
    listeners:
    - web
    match: Host(`spa.example.com`) && PathPrefix(`/downloads/`)
    max_body: 1MiB
    middlewares:
    - spa-example-com-alias
    - spa-example-com-static-3
    priority: 2000110
    tls: "off"
  spa-example-com-root:
    listeners:
    - web
    match: Host(`spa.example.com`) && PathPrefix(`/`)
    max_body: 1MiB
    middlewares:
    - spa-example-com-static
    priority: 2000010
    tls: "off"
