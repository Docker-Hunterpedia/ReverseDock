# Exercises: a static site and a single-page app: root, index, try_files idioms, expires, autoindex, alias.
http {
    server {
        listen 80;
        server_name spa.example.com;
        root /srv/spa;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
        location /assets/ {
            expires 30d;
            try_files $uri =404;
        }
        location /downloads/ {
            alias /srv/files/;
            autoindex on;
        }
    }
}
