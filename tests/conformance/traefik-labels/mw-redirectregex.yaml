description: "redirectregex with a replacement."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.middlewares.r.redirectregex.regex: "^https://old.example.com/(.*)"
      traefik.http.middlewares.r.redirectregex.replacement: "https://new.example.com/${1}"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app: {}
  services:
    app: {}
  middlewares:
    r:
      type: "redirect"
      regex: "^https://old.example.com/(.*)"
      replacement: "https://new.example.com/${1}"
