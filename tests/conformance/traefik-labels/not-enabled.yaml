description: "Containers are opt-in: no enable label, nothing exposed, and a warning says how to get Traefik's exposedByDefault."
containers:
  - name: "db"
    labels:
      traefik.http.routers.db.rule: "Host(`db.example.com`)"
    networks:
      web: "172.18.0.2"
    ports:
      - 5432
expect:
  diagnostics:
    - "docker.db: the container has Traefik router labels but is not exposed: containers are not exposed by default"
