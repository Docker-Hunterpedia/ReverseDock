description: "passhostheader=false sends the backend's own Host."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.services.app.loadbalancer.passhostheader: "false"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app: {}
  services:
    app:
      pass_host_header: false
