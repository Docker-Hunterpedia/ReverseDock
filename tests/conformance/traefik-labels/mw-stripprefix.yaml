description: "stripprefix with several prefixes."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.middlewares.s.stripprefix.prefixes: "/api,/v1"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app: {}
  services:
    app: {}
  middlewares:
    s:
      type: "strip_prefix"
      prefixes:
        - "/api"
        - "/v1"
