description: "A TCP router with HostSNI(`*`) relays to the container's port; it needs entrypoints."
containers:
  - name: "db"
    labels:
      traefik.enable: "true"
      traefik.tcp.routers.db.rule: "HostSNI(`*`)"
      traefik.tcp.routers.db.entrypoints: "postgres"
      traefik.tcp.services.db.loadbalancer.server.port: "5432"
    networks:
      web: "172.18.0.2"
    ports:
      - 5432
expect:
  tcp_routes:
    db:
      match: "HostSNI(`*`)"
      listeners: ["postgres"]
      service: "db"
      priority: 0
      middlewares: []
  tcp_services:
    db:
      backends:
        - address: "172.18.0.2:5432"
          weight: 1
          backup: false
