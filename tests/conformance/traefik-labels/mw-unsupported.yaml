description: "Traefik plugin middlewares are warnings naming the label and why; a chain is inlined (mw-chain.yaml)."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.middlewares.p.plugin.demo.key: "v"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app: {}
  services:
    app: {}
  diagnostics:
    - "p.plugin.demo.key\"]: Traefik (Yaegi) plugins do not run here"
