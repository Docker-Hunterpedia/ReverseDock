description: "Any certresolver means automatic certificates from the default ACME account."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.routers.app.tls.certresolver: "letsencrypt"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app:
      tls:
        auto: true
  services:
    app: {}
