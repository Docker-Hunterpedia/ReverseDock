description: "A router without a service on a container with two services is ignored."
containers:
  - name: "stack"
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`web.example.com`)"
      traefik.http.services.a.loadbalancer.server.port: "80"
      traefik.http.services.b.loadbalancer.server.port: "9000"
    networks:
      web: "172.18.0.6"
    ports:
      - 80
      - 9000
expect:
  services:
    a:
      backends:
        - address: "172.18.0.6:80"
          weight: 1
    b:
      backends:
        - address: "172.18.0.6:9000"
          weight: 1
  diagnostics:
    - "docker.stack: route `web` names no service and the container has 2 services"
