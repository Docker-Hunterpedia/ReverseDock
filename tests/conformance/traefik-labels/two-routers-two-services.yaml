description: "Each router names its own service and port."
containers:
  - name: "stack"
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`web.example.com`)"
      traefik.http.routers.web.service: "web"
      traefik.http.routers.metrics.rule: "Host(`metrics.example.com`)"
      traefik.http.routers.metrics.service: "metrics"
      traefik.http.services.web.loadbalancer.server.port: "80"
      traefik.http.services.metrics.loadbalancer.server.port: "9000"
    networks:
      web: "172.18.0.6"
    ports:
      - 80
      - 9000
expect:
  routes:
    metrics:
      service: "metrics"
    web:
      service: "web"
  services:
    metrics:
      backends:
        - address: "172.18.0.6:9000"
          weight: 1
          backup: false
    web:
      backends:
        - address: "172.18.0.6:80"
          weight: 1
          backup: false
