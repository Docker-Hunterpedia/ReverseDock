description: "providers.docker.network chooses among several networks."
settings:
  network: "proxy"
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
    networks:
      internal: "10.0.1.5"
      proxy: "10.0.2.5"
    ports:
      - 80
expect:
  routes:
    app: {}
  services:
    app:
      backends:
        - address: "10.0.2.5:80"
          weight: 1
