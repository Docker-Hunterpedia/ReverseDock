description: "Several exposed ports and no port label: warning, no service."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
      - 443
      - 9000
expect:
  routes:
    app:
      service: "app"
  diagnostics:
    - "docker.app: service `app`: the container exposes 3 ports (80, 443, 9000)"
