description: "Traffic options without an equivalent (buffering, circuit breaker, Redis and per-middleware IP strategies, request-host keys) are warnings with the reason or what to do instead."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.middlewares.x.buffering.maxrequestbodybytes: "1000000"
      traefik.http.middlewares.x.buffering.maxresponsebodybytes: "1000000"
      traefik.http.middlewares.x.buffering.memrequestbodybytes: "1000000"
      traefik.http.middlewares.x.buffering.memresponsebodybytes: "1000000"
      traefik.http.middlewares.x.buffering.retryexpression: "IsNetworkError()"
      traefik.http.middlewares.x.circuitbreaker.checkperiod: "10s"
      traefik.http.middlewares.x.circuitbreaker.expression: "NetworkErrorRatio() > 0.5"
      traefik.http.middlewares.x.circuitbreaker.fallbackduration: "10s"
      traefik.http.middlewares.x.circuitbreaker.recoveryduration: "10s"
      traefik.http.middlewares.x.circuitbreaker.responsecode: "503"
      traefik.http.middlewares.x.inflightreq.sourcecriterion.ipstrategy.depth: "1"
      traefik.http.middlewares.x.inflightreq.sourcecriterion.ipstrategy.excludedips: "10.0.0.1"
      traefik.http.middlewares.x.inflightreq.sourcecriterion.ipstrategy.ipv6subnet: "64"
      traefik.http.middlewares.x.inflightreq.sourcecriterion.requesthost: "true"
      traefik.http.middlewares.x.ipallowlist.ipstrategy: "true"
      traefik.http.middlewares.x.ipallowlist.ipstrategy.depth: "1"
      traefik.http.middlewares.x.ipallowlist.ipstrategy.excludedips: "10.0.0.1"
      traefik.http.middlewares.x.ipallowlist.ipstrategy.ipv6subnet: "64"
      traefik.http.middlewares.x.ipallowlist.rejectstatuscode: "404"
      traefik.http.middlewares.x.ipwhitelist.ipstrategy: "true"
      traefik.http.middlewares.x.ipwhitelist.ipstrategy.depth: "1"
      traefik.http.middlewares.x.ipwhitelist.ipstrategy.excludedips: "10.0.0.1"
      traefik.http.middlewares.x.ipwhitelist.ipstrategy.ipv6subnet: "64"
      traefik.http.middlewares.x.ratelimit.redis.db: "0"
      traefik.http.middlewares.x.ratelimit.redis.dialtimeout: "5s"
      traefik.http.middlewares.x.ratelimit.redis.endpoints: "redis:6379"
      traefik.http.middlewares.x.ratelimit.redis.maxactiveconns: "10"
      traefik.http.middlewares.x.ratelimit.redis.minidleconns: "1"
      traefik.http.middlewares.x.ratelimit.redis.password: "not-a-secret"
      traefik.http.middlewares.x.ratelimit.redis.poolsize: "10"
      traefik.http.middlewares.x.ratelimit.redis.readtimeout: "3s"
      traefik.http.middlewares.x.ratelimit.redis.tls.ca: "/ca.pem"
      traefik.http.middlewares.x.ratelimit.redis.tls.cert: "/c.pem"
      traefik.http.middlewares.x.ratelimit.redis.tls.insecureskipverify: "true"
      traefik.http.middlewares.x.ratelimit.redis.tls.key: "/k.pem"
      traefik.http.middlewares.x.ratelimit.redis.username: "rdock"
      traefik.http.middlewares.x.ratelimit.redis.writetimeout: "3s"
      traefik.http.middlewares.x.ratelimit.sourcecriterion.ipstrategy.depth: "1"
      traefik.http.middlewares.x.ratelimit.sourcecriterion.ipstrategy.excludedips: "10.0.0.1"
      traefik.http.middlewares.x.ratelimit.sourcecriterion.ipstrategy.ipv6subnet: "64"
      traefik.http.middlewares.x.ratelimit.sourcecriterion.requesthost: "true"
      traefik.http.middlewares.x.retry.initialinterval: "100ms"
      traefik.http.middlewares.x.retry.maxrequestbodybytes: "1000"
      traefik.http.middlewares.x.retry.timeout: "5s"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app: {}
  services:
    app: {}
  diagnostics:
    - "traefik.http.middlewares.x.buffering.maxrequestbodybytes\"]"
    - "traefik.http.middlewares.x.buffering.maxresponsebodybytes\"]"
    - "traefik.http.middlewares.x.buffering.memrequestbodybytes\"]"
    - "traefik.http.middlewares.x.buffering.memresponsebodybytes\"]"
    - "traefik.http.middlewares.x.buffering.retryexpression\"]"
    - "traefik.http.middlewares.x.circuitbreaker.checkperiod\"]"
