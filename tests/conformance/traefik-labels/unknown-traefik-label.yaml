description: "Labels that are not Traefik v3.7 labels are warnings naming them."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.routers.app.no-such-option: "false"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app: {}
  services:
    app: {}
  diagnostics:
    - "app.no-such-option\"]: not in the supported Traefik label subset"
