description: "Middlewares keep their provider suffixes."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.routers.app.middlewares: "auth@file, strip"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app:
      middlewares:
        - "auth@file"
        - "strip"
  services:
    app: {}
