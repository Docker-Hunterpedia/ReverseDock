description: "Unmapped entrypoint names are used as listener names."
containers:
  - name: "app"
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "Host(`app.example.com`)"
      traefik.http.routers.app.entrypoints: "websecure"
    networks:
      web: "172.18.0.2"
    ports:
      - 80
expect:
  routes:
    app:
      listeners:
        - "websecure"
  services:
    app: {}
