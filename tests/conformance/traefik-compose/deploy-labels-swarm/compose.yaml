# Corpus case `deploy-labels-swarm` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: deploy.labels read as container labels, Swarm options dropped.
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  web:
    image: traefik/whoami:v1.12.0
    deploy:
      replicas: 2
      labels:
        traefik.enable: "true"
        traefik.http.routers.web.rule: Host(`web.example.com`)
        traefik.http.routers.web.entrypoints: websecure
        traefik.http.routers.web.tls: "true"
        traefik.http.services.web.loadbalancer.server.port: "80"
        traefik.swarm.network: proxy
