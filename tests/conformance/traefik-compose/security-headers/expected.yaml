# Generated by `rdock migrate traefik` from compose.yaml: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 16 source item(s): 15 exact, 1 approximate, 0 manual, 0 dropped
# To review (1):
#   - [traefik.label.approximate] compose.yaml: blog: label traefik.http.routers.blog.tls → routes.blog: `tls.auto: true` (`true`) or `tls: off` (`false`); `true` without a resolver gets an automatic certificate here (Traefik: a stored certificate or its default one)
middlewares:
  secure-headers:
    hsts:
      include_subdomains: true
      max_age: 365d
      preload: true
    response:
      set:
        Content-Security-Policy: default-src 'self'
        Permissions-Policy: camera=(), microphone=()
        Referrer-Policy: strict-origin-when-cross-origin
        X-Content-Type-Options: nosniff
        X-Frame-Options: SAMEORIGIN
        X-XSS-Protection: 1; mode=block
    type: headers
routes:
  blog:
    listeners:
    - websecure
    match: Host(`blog.example.com`)
    middlewares:
    - secure-headers
    service: blog
    tls:
      auto: true
services:
  blog:
    backends:
    - address: blog:80
