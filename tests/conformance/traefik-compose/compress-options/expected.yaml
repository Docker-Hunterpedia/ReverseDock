middlewares:
  gz:
    algorithms:
    - br
    - gzip
    content_types:
    - text/html
    - text/css
    - application/json
    min_size: 512B
    type: compress
routes:
  docs:
    listeners:
    - websecure
    match: Host(`docs.example.com`)
    middlewares:
    - gz
    service: docs
    tls:
      auto: true
services:
  docs:
    backends:
    - address: docs:80
