# Corpus case `traefik-service-flags-full` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: the Traefik service's command flags, entry points, HTTP to HTTPS redirection, http.tls on an entry point, HTTP-01 resolver, exposedByDefault=false, --full.
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  traefik:
    image: traefik:v3.7.19
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --certificatesresolvers.le.acme.email=admin@example.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --accesslog=true
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  app:
    image: traefik/whoami:v1.12.0
    expose: [80]
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.example.com`)
      - traefik.http.routers.app.entrypoints=websecure
