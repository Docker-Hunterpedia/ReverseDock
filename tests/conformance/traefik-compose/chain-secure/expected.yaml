# Generated by `rdock migrate traefik` from compose.yaml: an rdock.yaml fragment (add listeners and defaults as needed). Review before use.
# 12 source item(s): 9 exact, 3 approximate, 0 manual, 0 dropped
# To review (3):
#   - [traefik.label.approximate] compose.yaml: app: label traefik.http.routers.app.tls → routes.app: `tls.auto: true` (`true`) or `tls: off` (`false`); `true` without a resolver gets an automatic certificate here (Traefik: a stored certificate or its default one)
#   - [traefik.label.approximate] compose.yaml: app: label traefik.http.middlewares.rl.ratelimit.average → middlewares.rl: `rate_limit.average`; without `burst`, the burst is `average` (Traefik: 1)
#   - [traefik.label.approximate] compose.yaml: app: label traefik.http.middlewares.gz.compress → middlewares.gz: `compress` with its defaults; ReverseDock compresses common text types only (Traefik: every type not excluded, and it sniffs a missing `Content-Type`), and prefers zstd, then br, then gzip (Traefik: gzip, br, zstd)
middlewares:
  gz:
    algorithms:
    - zstd
    - br
    - gzip
    min_size: 1KiB
    type: compress
  hsts:
    hsts:
      include_subdomains: false
      max_age: 730d
      preload: false
    type: headers
  rl:
    average: 50
    burst: 100
    headers: "off"
    key: client_ip
    period: 1s
    type: rate_limit
routes:
  app:
    listeners:
    - websecure
    match: Host(`app.example.com`)
    middlewares:
    - hsts
    - rl
    - gz
    service: app
    tls:
      auto: true
services:
  app:
    backends:
    - address: app:80
