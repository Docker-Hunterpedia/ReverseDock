routes:
  portal:
    listeners:
    - websecure
    match: HostRegexp(`^.+\.example\.com$`)
    service: portal
    tls:
      auto: true
      domains:
      - example.com
      - "*.example.com"
services:
  portal:
    backends:
    - address: portal:80
