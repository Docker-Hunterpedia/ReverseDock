# Corpus case `ip-allowlist` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: ipallowlist.sourcerange, ipwhitelist (old name), ipstrategy (no equivalent).
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  intranet:
    image: traefik/whoami:v1.12.0
    expose: [80]
    labels:
      - traefik.enable=true
      - traefik.http.routers.intranet.rule=Host(`intranet.example.com`)
      - traefik.http.routers.intranet.entrypoints=websecure
      - traefik.http.routers.intranet.tls=true
      - traefik.http.routers.intranet.middlewares=office,legacy
      - traefik.http.middlewares.office.ipallowlist.sourcerange=10.0.0.0/8,192.168.0.0/16
      - traefik.http.middlewares.legacy.ipwhitelist.sourcerange=10.0.0.0/8
      - traefik.http.middlewares.legacy.ipwhitelist.ipstrategy.depth=2
