middlewares:
  sso:
    address: http://auth:9091/api/verify?rd=https://auth.example.com/
    copy_headers:
    - Remote-User
    - Remote-Groups
    - Remote-Email
    request_headers:
    - Accept
    - Cookie
    timeout: 5s
    trust_forward_header: true
    type: forward_auth
routes:
  auth:
    listeners:
    - websecure
    match: Host(`auth.example.com`)
    service: auth
    tls:
      auto: true
  wiki:
    listeners:
    - websecure
    match: Host(`wiki.example.com`)
    middlewares:
    - sso
    service: wiki
    tls:
      auto: true
services:
  auth:
    backends:
    - address: auth:9091
  wiki:
    backends:
    - address: wiki:3000
