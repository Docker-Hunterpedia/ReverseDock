middlewares:
  global:
    average: 1000
    headers: "off"
    key: client_ip
    period: 1s
    type: rate_limit
  per-key:
    average: 100
    burst: 20
    headers: "off"
    key: header:X-Api-Key
    period: 1m
    type: rate_limit
routes:
  api:
    listeners:
    - websecure
    match: Host(`api.example.com`)
    middlewares:
    - per-key
    - global
    service: api
    tls:
      auto: true
services:
  api:
    backends:
    - address: api:80
