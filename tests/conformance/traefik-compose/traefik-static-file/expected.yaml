acme:
  challenges:
  - dns-01
  dns_provider: cloudflare
  dns_providers:
    cloudflare:
      api_token: ${env:CF_DNS_API_TOKEN}
      type: cloudflare
  dns_resolvers:
  - 1.1.1.1:53
  email: admin@example.com
  staging: true
defaults:
  listeners:
  - websecure
  redirect_http_to_https: true
listeners:
  web:
    address: ":80"
  websecure:
    address: ":443"
    proxy_protocol:
      trusted:
      - "10.0.0.1"
    tls: {}
observability:
  metrics:
    prometheus: true
providers:
  docker:
    expose_by_default: false
    network: proxy
  file:
    paths:
    - /etc/traefik/dynamic
    watch: true
security:
  trusted_proxies:
  - 10.0.0.0/8
