# Corpus case `traefik-static-file` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: --static traefik.yml, DNS-01 with a lego provider (credentials referenced, not copied), forwardedHeaders.trustedIPs, proxyProtocol.trustedIPs, file provider, metrics, api.dashboard.
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  app:
    image: traefik/whoami:v1.12.0
    expose: [80]
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: Host(`app.example.com`)
      traefik.http.routers.app.entrypoints: websecure
      traefik.http.routers.app.tls.certresolver: dns
