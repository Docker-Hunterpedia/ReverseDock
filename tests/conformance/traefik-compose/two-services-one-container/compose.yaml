# Corpus case `two-services-one-container` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: two services on one container, explicit router services.
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  app:
    image: traefik/whoami:v1.12.0
    expose: [80, 9000]
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`app.example.com`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.service=web-svc
      - traefik.http.services.web-svc.loadbalancer.server.port=80
      - traefik.http.routers.metrics.rule=Host(`metrics.example.com`)
      - traefik.http.routers.metrics.entrypoints=websecure
      - traefik.http.routers.metrics.tls=true
      - traefik.http.routers.metrics.service=metrics-svc
      - traefik.http.services.metrics-svc.loadbalancer.server.port=9000
