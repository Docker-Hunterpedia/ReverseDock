middlewares:
  api-cors:
    response:
      set:
        x-api-version: "2"
    type: headers
  api-cors-cors:
    allow_credentials: false
    allowed_headers:
    - Content-Type
    - Authorization
    allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    allowed_origins:
    - https://app.example.com
    max_age: 1m40s
    type: cors
routes:
  api:
    listeners:
    - websecure
    match: Host(`api.example.com`)
    middlewares:
    - api-cors
    - api-cors-cors
    service: api
    tls:
      auto: true
services:
  api:
    backends:
    - address: api:80
