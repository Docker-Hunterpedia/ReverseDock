middlewares:
  to-https:
    always: false
    permanent: true
    scheme: https
    type: redirect
routes:
  shop:
    listeners:
    - websecure
    match: Host(`shop.example.com`)
    service: shop
    tls:
      auto: true
  shop-http:
    listeners:
    - web
    match: Host(`shop.example.com`)
    middlewares:
    - to-https
    service: shop
services:
  shop:
    backends:
    - address: shop:80
