# Corpus case `healthcheck` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: healthcheck path, interval, timeout, hostname, headers, status, method, port, passivehealthcheck, healthcheck.scheme (none).
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  api:
    image: traefik/whoami:v1.12.0
    expose: [80, 8081]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.example.com`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: "true"
      traefik.http.services.api.loadbalancer.server.port: "80"
      traefik.http.services.api.loadbalancer.healthcheck.path: /health
      traefik.http.services.api.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 3s
      traefik.http.services.api.loadbalancer.healthcheck.hostname: api.internal
      traefik.http.services.api.loadbalancer.healthcheck.headers.X-Probe: "1"
      traefik.http.services.api.loadbalancer.healthcheck.status: "204"
      traefik.http.services.api.loadbalancer.healthcheck.method: HEAD
      traefik.http.services.api.loadbalancer.healthcheck.port: "8081"
      traefik.http.services.api.loadbalancer.healthcheck.scheme: http
      traefik.http.services.api.loadbalancer.passivehealthcheck.failurewindow: "30"
      traefik.http.services.api.loadbalancer.passivehealthcheck.maxfailedattempts: "5"
