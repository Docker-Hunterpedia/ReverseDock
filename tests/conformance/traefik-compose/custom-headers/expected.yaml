middlewares:
  hdrs:
    request:
      remove:
      - x-forwarded-user
      set:
        x-script-name: /app
    response:
      remove:
      - server
      set:
        x-served-by: edge
    type: headers
routes:
  app:
    listeners:
    - websecure
    match: Host(`app.example.com`)
    middlewares:
    - hdrs
    service: app
    tls:
      auto: true
services:
  app:
    backends:
    - address: app:80
