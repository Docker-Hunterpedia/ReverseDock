# Corpus case `custom-headers` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: customRequestHeaders, customResponseHeaders, an empty value removes a header.
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  app:
    image: traefik/whoami:v1.12.0
    expose: [80]
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.example.com`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.routers.app.middlewares=hdrs
      - traefik.http.middlewares.hdrs.headers.customRequestHeaders.X-Script-Name=/app
      - traefik.http.middlewares.hdrs.headers.customRequestHeaders.X-Forwarded-User=
      - traefik.http.middlewares.hdrs.headers.customResponseHeaders.X-Served-By=edge
      - traefik.http.middlewares.hdrs.headers.customResponseHeaders.Server=
