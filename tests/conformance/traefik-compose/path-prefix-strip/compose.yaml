# Corpus case `path-prefix-strip` (tests/conformance/traefik-compose, ADR-0033).
# Exercises: PathPrefix, stripprefix.prefixes, router middlewares.
# Written by hand in the shape of Traefik's documented Docker examples; nothing is copied.
services:
  api:
    image: traefik/whoami:v1.12.0
    expose: [80]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`example.com`) && PathPrefix(`/api`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: "true"
      traefik.http.routers.api.middlewares: api-strip
      traefik.http.middlewares.api-strip.stripprefix.prefixes: /api
