# Fuzz targets (cargo-fuzz). A separate workspace: libfuzzer-sys carries the NCSA licence, which
# the main workspace's cargo-deny policy does not allow, and fuzzing needs a nightly toolchain.
#   cargo +nightly fuzz run h1_framing      (from this directory)
#   cargo test                              (replays the seed corpus on stable)
[package]
name = "rdock-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.12.1"
http = "1.5.0"
httparse = "1.10.1"
libfuzzer-sys = "0.4.13"
pingora-core = { version = "0.9.1", default-features = false }
pingora-http = "0.9.1"
# The PROXY protocol parser rdock-proxy uses on network bytes (pinned like the main workspace).
proxy-header = { version = "=0.1.3", default-features = false }
rdock-cache = { path = "../../crates/rdock-cache" }
rdock-config = { path = "../../crates/rdock-config" }
rdock-middleware = { path = "../../crates/rdock-middleware" }
rdock-model = { path = "../../crates/rdock-model" }
# The HTTP/3 request mapping (decoding and validation, ADR-0032); built without the `http3` feature.
rdock-proxy = { path = "../../crates/rdock-proxy" }
rdock-rules = { path = "../../crates/rdock-rules" }
rdock-tls = { path = "../../crates/rdock-tls" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "rt", "time"] }

[[bin]]
name = "http3_request"
path = "fuzz_targets/http3_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_framing"
path = "fuzz_targets/h1_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rules_parser"
path = "fuzz_targets/rules_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt_verify"
path = "fuzz_targets/jwt_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_header"
path = "fuzz_targets/proxy_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_loader"
path = "fuzz_targets/config_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clienthello"
path = "fuzz_targets/clienthello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_fingerprint"
path = "fuzz_targets/tls_fingerprint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "disk_cache_header"
path = "fuzz_targets/disk_cache_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_patch"
path = "fuzz_targets/json_patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oidc_cookie"
path = "fuzz_targets/oidc_cookie.rs"
test = false
doc = false
bench = false

