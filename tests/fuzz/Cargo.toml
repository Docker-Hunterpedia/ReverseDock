# Fuzz targets (cargo-fuzz). A separate workspace: libfuzzer-sys carries the NCSA licence, which
# the main workspace's cargo-deny policy does not allow, and fuzzing needs a nightly toolchain.
#   cargo +nightly fuzz run h1_framing      (from this directory)
#   cargo test                              (replays the seed corpus on stable)
[package]
name = "rdock-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.12.1"
http = "1.5.0"
httparse = "1.10.1"
libfuzzer-sys = "0.4.13"
pingora-core = { version = "0.9.1", default-features = false }
pingora-http = "0.9.1"
# The PROXY protocol parser rdock-proxy uses on network bytes (pinned like the main workspace).
proxy-header = { version = "=0.1.3", default-features = false }
# ACME: our parsing of a CA's answers and the renewal state (target `acme_answers`).
rdock-acme = { path = "../../crates/rdock-acme" }
# The admin API's request bodies and query strings (target `admin_input`).
rdock-admin = { path = "../../crates/rdock-admin" }
rdock-cache = { path = "../../crates/rdock-cache" }
# Cluster bundles and messages, and the RESP reader (targets `cluster_protocol`, `resp_reader`).
rdock-cluster = { path = "../../crates/rdock-cluster" }
rdock-config = { path = "../../crates/rdock-config" }
rdock-middleware = { path = "../../crates/rdock-middleware" }
# `rdock migrate caddy`, Compose interpolation and `rdock migrate traefik` (targets
# `migrate_caddy`, `compose_interpolation`); it brings the Docker provider's label translator
# (target `docker_labels`).
rdock-migrate = { path = "../../crates/rdock-migrate" }
rdock-model = { path = "../../crates/rdock-model" }
rdock-provider-docker = { path = "../../crates/providers/rdock-provider-docker" }
# The HTTP/3 request mapping (decoding and validation, ADR-0032); built without the `http3` feature.
rdock-proxy = { path = "../../crates/rdock-proxy" }
rdock-rules = { path = "../../crates/rdock-rules" }
rdock-tls = { path = "../../crates/rdock-tls" }
serde_json = "1.0.154"
# The NGINX parser of `rdock migrate nginx`, compiled in from its source file (`src/lib.rs`): the
# migration crate itself would bring the Docker provider into this lock.
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "rt", "time"] }

[[bin]]
name = "http3_request"
path = "fuzz_targets/http3_request.rs"
test = false
doc = false
bench = false

