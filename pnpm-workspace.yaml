packages:
  - apps/*
  - packages/*

# Exact versions in package.json; Dependabot proposes updates.
saveExact: true

# @hey-api/json-schema-ref-parser 1.4.4 (via @hey-api/openapi-ts, dashboard build only)
# pins js-yaml 4.2.0, which has GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj and
# GHSA-2883-xcg3-v3hh (fixed in 4.3.2). Remove when a parser release depends on >= 4.3.2.
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': 4.3.2
  # lighthouse 13.6 -> @sentry/bundler-plugins 11.10.0 -> glob 13 -> minimatch 10.2.6, which has an
  # advisory fixed in 11.0.1; glob 14 depends on minimatch ^11.0.5. Development tooling only.
  # Remove when the bundler plugin depends on glob >= 14.
  '@sentry/bundler-plugins>glob': 14.0.6
  # @napi-rs/wasm-runtime accepts @emnapi/runtime "^1.7.1 || 2.0.0-beta.2", and a fresh resolution
  # picks the beta, with which `astro check` cannot load @astrojs/check. Stay on the 1.x line.
  # Remove when a stable 2.x exists and astro check works with it.
  '@emnapi/runtime@>=2.0.0-0': 1.11.3

minimumReleaseAgeExclude:
  - glob@14.0.6
