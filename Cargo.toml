[workspace]
resolver = "3"
# Fuzz targets live in their own workspace (nightly, cargo-fuzz, libFuzzer's licence).
exclude = ["tests/fuzz"]
members = [
  "crates/rdock",
  "crates/rdock-model",
  "crates/rdock-rules",
  "crates/rdock-config",
  "crates/rdock-proxy",
  "crates/rdock-tls",
  "crates/rdock-acme",
  "crates/rdock-balancer",
  "crates/rdock-middleware",
  "crates/rdock-limits",
  "crates/rdock-observability",
  "crates/rdock-admin",
  "crates/rdock-cloudflare",
  "crates/rdock-migrate",
  "crates/rdock-testkit",
  "crates/providers/rdock-provider-file",
  "crates/providers/rdock-provider-docker",
  "crates/providers/rdock-provider-swarm",
  "crates/providers/rdock-provider-kubernetes",
  "crates/providers/rdock-provider-api",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["The ReverseDock Authors"]
repository = "https://github.com/Docker-Hunterpedia/ReverseDock"
homepage = "https://github.com/Docker-Hunterpedia/ReverseDock"
publish = false

[workspace.dependencies]
# Internal crates
rdock-admin = { path = "crates/rdock-admin" }
rdock-balancer = { path = "crates/rdock-balancer" }
rdock-config = { path = "crates/rdock-config" }
rdock-limits = { path = "crates/rdock-limits" }
rdock-middleware = { path = "crates/rdock-middleware" }
rdock-model = { path = "crates/rdock-model" }
rdock-observability = { path = "crates/rdock-observability" }
rdock-provider-docker = { path = "crates/providers/rdock-provider-docker" }
rdock-provider-file = { path = "crates/providers/rdock-provider-file" }
rdock-proxy = { path = "crates/rdock-proxy" }
rdock-rules = { path = "crates/rdock-rules" }
rdock-testkit = { path = "crates/rdock-testkit" }
rdock-tls = { path = "crates/rdock-tls" }

# External crates (versions verified on crates.io, 2026-10-26)
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = "2.12.2"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
url = "2.5.8"

# Data plane (Pingora 0.9.0 and the crates it already brings in, at the same versions)
pingora = { version = "0.9.0", default-features = false, features = ["proxy", "rustls"] }
# Pingora 0.9.0 panics on every accepted connection with tokio >= 1.54 (zero-capacity BufStream,
# tokio#8494); 1.53.3 has no open advisory. Keep this cap until Pingora ships a fix.
tokio = { version = ">=1.53.3, <1.54", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
arc-swap = "1.9.3"
async-trait = "0.1.92"
bytes = "1.12.1"
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-ng"] }
http = "1.5.0"
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "std"] }
x509-parser = "0.18.1"

# Middlewares
argon2 = "0.6.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
fastrand = "2.5.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
subtle = "2.6.1"
uuid = { version = "1.29.0", features = ["v7"] }

# Providers (bollard 0.21.1 released 2026-08-16; no TLS features, Docker endpoints are unix sockets or plain tcp://)
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
futures-util = { version = "0.3.34", default-features = false }

# Operations
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
prometheus = { version = "0.14.0", default-features = false }
sd-notify = "0.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "smallvec", "std", "tracing-log"] }

# Test-only
assert_cmd = "2.2.2"
h2 = "0.4.20"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "tokio"] }
jsonschema = { version = "0.60.1", default-features = false }
predicates = "3.1.4"
proptest = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = "0.30.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
