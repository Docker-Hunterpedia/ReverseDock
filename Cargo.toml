[workspace]
resolver = "3"
# Fuzz targets live in their own workspace (nightly, cargo-fuzz, libFuzzer's licence).
exclude = ["tests/fuzz"]
members = [
  "crates/rdock",
  "crates/rdock-model",
  "crates/rdock-rules",
  "crates/rdock-config",
  "crates/rdock-proxy",
  "crates/rdock-tls",
  "crates/rdock-acme",
  "crates/rdock-balancer",
  "crates/rdock-cache",
  "crates/rdock-middleware",
  "crates/rdock-plugin-api",
  "crates/rdock-limits",
  "crates/rdock-observability",
  "crates/rdock-admin",
  "crates/rdock-cloudflare",
  "crates/rdock-credentials",
  "crates/rdock-dns-providers",
  "crates/rdock-migrate",
  "crates/rdock-testkit",
  "crates/providers/rdock-provider-file",
  "crates/providers/rdock-provider-docker",
  "crates/providers/rdock-provider-swarm",
  "crates/providers/rdock-provider-kubernetes",
  "crates/providers/rdock-provider-api",
  # Native plugin SDK examples and the template (ADR-0030); built and tested in CI.
  "examples/plugins/header-rewrite",
  "examples/plugins/ip-blocklist",
  "examples/plugins/custom-rdock",
  "examples/plugins/template",
]

[workspace.package]
version = "0.6.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["The ReverseDock Authors"]
repository = "https://github.com/Docker-Hunterpedia/ReverseDock"
homepage = "https://github.com/Docker-Hunterpedia/ReverseDock"
publish = false

[workspace.dependencies]
# Internal crates
rdock-admin = { path = "crates/rdock-admin" }
rdock-balancer = { path = "crates/rdock-balancer" }
rdock-cache = { path = "crates/rdock-cache" }
rdock-cloudflare = { path = "crates/rdock-cloudflare" }
rdock-acme = { path = "crates/rdock-acme" }
rdock-config = { path = "crates/rdock-config" }
rdock-credentials = { path = "crates/rdock-credentials" }
rdock-dns-providers = { path = "crates/rdock-dns-providers" }
rdock-limits = { path = "crates/rdock-limits" }
rdock-middleware = { path = "crates/rdock-middleware" }
rdock-migrate = { path = "crates/rdock-migrate" }
rdock-model = { path = "crates/rdock-model" }
rdock-observability = { path = "crates/rdock-observability" }
rdock-plugin-api = { path = "crates/rdock-plugin-api" }
rdock-provider-docker = { path = "crates/providers/rdock-provider-docker" }
rdock-provider-file = { path = "crates/providers/rdock-provider-file" }
rdock-provider-kubernetes = { path = "crates/providers/rdock-provider-kubernetes" }
rdock-provider-swarm = { path = "crates/providers/rdock-provider-swarm" }
rdock-proxy = { path = "crates/rdock-proxy" }
rdock-rules = { path = "crates/rdock-rules" }
rdock-testkit = { path = "crates/rdock-testkit" }
rdock-tls = { path = "crates/rdock-tls" }

# External crates (versions verified on crates.io, 2026-10-26)
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = { version = "2.12.2", features = ["serde"] }
# Configuration API (ADR-0024): line diffs with a deadline, RFC 6902 JSON Patch.
similar = "3.2.1"
# Alert e-mail (ADR-0024): no default features, which would pull native-tls (OpenSSL).
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier", "tracing"] }
json-patch = { version = "4.2.0", default-features = false }
# JSON Schema 2020-12 for `validate` (F-GW-03, ADR-0030) and schema tests. No default features:
# no HTTP or file resolver (no reqwest, rustls or tokio), so a schema can never fetch anything.
jsonschema = { version = "0.60.1", default-features = false }
# The checksum in API tokens (ADR-0024); already in the tree through flate2.
crc32fast = "1.5.0"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
url = "2.5.8"

# Data plane (Pingora 0.9.1, released 2026-11-03, and the crates it already brings in, at the same
# versions). 0.9.1 replaces the zero-capacity `BufStream` that panicked on every accepted connection
# with tokio >= 1.54 (tokio#8494, pingora#1059), so the `<1.54` cap is gone (checked 2026-11-11 with
# the whole suite and `e2e_proxy::tokio_1_54_regression_*`).
# `cache` only re-exports pingora-cache, which pingora-proxy already builds (ADR-0030, F-WEB-03).
pingora = { version = "0.9.1", default-features = false, features = ["proxy", "rustls", "cache"] }
# tokio 1.54.1 (1.54.0 is yanked) declares rust-version 1.85, within our MSRV.
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
arc-swap = "1.9.3"
async-trait = "0.1.92"
bytes = "1.12.1"
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-ng"] }
http = "1.5.0"
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "std"] }
x509-parser = "0.18.1"
time = { version = "0.3.55", default-features = false, features = ["std"] }

# Middlewares
argon2 = "0.6.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
fastrand = "2.5.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
subtle = "2.6.1"
# Static files (ADR-0026): the root opened once as a directory handle (openat2 RESOLVE_BENEATH on
# Linux 5.6+; 4.0.3 released 2026-08-20), `Range` parsing (0.4.2 released 2024-11-28), and media
# types (2.0.5, already built for rust-embed).
cap-std = "4.0.3"
http-range-header = "0.4.2"
mime_guess = "2.0.5"
# Tracing (ADR-0022): OTLP over HTTP/protobuf through our own hyper-rustls client; no tonic, no reqwest.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
# Response compression, at the versions pingora-core already builds.
brotli = "3.5.0"
zstd = "0.14.3"
# `Retry-After` dates (already built for hyper).
httpdate = "1.0.3"
# HMAC for sticky cookies and JWT signatures; already built for rustls (ADR-0013).
ring = "0.17.14"
# fast-rng: request ids from a thread-local generator, not a getrandom call per request (#93).
uuid = { version = "1.29.0", features = ["v7", "fast-rng"] }
# PROXY protocol v1/v2 parse and encode (ADR-0026; 0.1.3, MIT, released 2026-09-23). 0.x: pinned exactly.
proxy-header = { version = "=0.1.3", default-features = false }

# Providers (bollard 0.21.1 released 2026-08-16; no TLS features, Docker endpoints are unix sockets or plain tcp://)
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
futures-util = { version = "0.3.34", default-features = false }
# Kubernetes provider (ADR-0029): kube 5.0.0 released 2026-11-01, k8s-openapi 0.29.0 released 2026-10-28.
# rustls with ring, named explicitly (ADR-0013); no `ws`, `oauth`, `oidc`, `gzip` or proxy features.
kube = { version = "5.0.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive"] }
# v1_33 is the earliest API level 0.29 offers; we use only GA types that predate it.
k8s-openapi = { version = "0.29.0", default-features = false, features = ["std", "v1_33"] }

# Admin API (ADR-0024): axum on its own runtime; hyper and hyper-util are already in the tree.
tower-service = "0.3.3"
# The dashboard, embedded at build time (ADR-0024). debug-embed: debug builds embed too, never reading from disk at run time.
rust-embed = { version = "8.13.0", default-features = false, features = ["debug-embed", "include-exclude", "mime-guess"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
# OpenAPI 3.1 generated from the handlers (F-MGMT-01); utoipa 6.0.0 and utoipa-axum 0.3.0 released 2026-09-22.
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3.0"

# Operations
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
prometheus = { version = "0.14.0", default-features = false }
sd-notify = "0.5.0"
# Global allocator (0.1.52 released 2026-05-22): musl's malloc mapped and unmapped memory on the request path (#93).
mimalloc = "0.1.52"
# Raises the open-file limit at start (nix 0.31.3 released 2026-05-11; pingora-core builds it already).
nix = { version = "0.31.3", default-features = false, features = ["resource"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "smallvec", "std", "tracing-log"] }

# Test-only
assert_cmd = "2.2.2"
h2 = "0.4.20"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2", "server-auto", "service", "tokio"] }
# HTTPS client for webhooks and DNS APIs, the same build instant-acme uses (ring, OS roots).
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "rustls-platform-verifier", "tls12"] }
predicates = "3.1.4"
proptest = "1.12.0"
# DNS-01 propagation checks (ADR-0020); no DNSSEC or encrypted transports needed.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
# RFC 2136 updates and TSIG (ADR-0026): messages only, sent over our own sockets; ring only,
# the `dnssec-aws-lc-rs` feature would pull in aws-lc-rs.
hickory-proto = { version = "0.26.3", default-features = false, features = ["std", "dnssec-ring"] }
# ring only (ADR-0013); the default features would pull in aws-lc-rs (ADR-0020).
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "time", "x509-parser"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = "0.30.0"

# Cloudflare IP sync (W-CF-01): the HTTP client instant-acme already brings in, at the locked
# versions. ring only (ADR-0013); the default features would pull in aws-lc-rs.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The release build with symbols and line tables, for `perf` (benchmarks/README.md, "Profiling").
# Build with `RUSTFLAGS="-C force-frame-pointers=yes"` so call graphs work without DWARF unwinding.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
