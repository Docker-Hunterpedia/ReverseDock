# ReverseDock in front of one application, with Docker Compose.
#
#   docker compose up -d
#   curl -H 'Host: whoami.localhost' http://localhost/
#   docker compose exec rdock rdock status     # admin API from inside the container
#
# The config directory (rdock.yaml, and certificates under config/certs) is mounted read-only
# and reloaded when rdock.yaml changes. Mount the directory, not the single file: editors replace
# files on save, and a single-file mount keeps pointing at the deleted copy. State (history, the
# last-known-good copy and the admin token) lives in the `rdock-data` volume.
name: reversedock

services:
  rdock:
    image: ghcr.io/docker-hunterpedia/rdock:0.3.0-alpha.1
    # Or build from this repository: `build: ../..`
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config:/etc/rdock:ro
      - rdock-data:/var/lib/rdock
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Docker lets non-root processes bind ports below 1024 (net.ipv4.ip_unprivileged_port_start=0).
    stop_grace_period: 10s
    # Start after the backend so its name resolves on the first request (names are re-resolved
    # every 10 s afterwards).
    depends_on: [whoami]

  whoami:
    image: traefik/whoami:v1.11
    restart: unless-stopped

volumes:
  rdock-data:
