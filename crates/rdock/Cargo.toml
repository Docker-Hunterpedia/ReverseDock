[package]
name = "rdock"
description = "ReverseDock: one reverse proxy for every dock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
build = "build.rs"

# The proxy as a library: `rdock::run(registry)` is the whole command line, so a binary with
# native plugins is a few lines (F-EXT-02, ADR-0030). The stock binary below is that call with
# an empty registry.
[lib]
name = "rdock"
path = "src/lib.rs"

[[bin]]
name = "rdock"
path = "src/main.rs"
# The library carries the documentation; one `rdock` page, no file-name collision.
doc = false

[features]
default = ["docker", "swarm", "kubernetes", "mimalloc"]
# mimalloc as the global allocator (set by the library); off in a custom binary that brings
# its own.
mimalloc = ["dep:mimalloc"]
# The Docker provider (bollard). Off: a build that reads only files.
docker = ["dep:rdock-provider-docker"]
# The Docker Swarm provider; it reuses the Docker provider's translator.
swarm = ["dep:rdock-provider-swarm", "dep:rdock-provider-docker"]
# The Kubernetes provider: Gateway API controller and Ingress translation (kube, ADR-0029).
kubernetes = ["dep:rdock-provider-kubernetes"]
# Sandboxed WASM plugins on wasmtime (experimental, ADR-0030). Off by default: without it a
# configuration with `type: wasm` is refused with a diagnostic.
wasm = ["rdock-proxy/wasm", "rdock-middleware/wasm"]
# HTTP/3 ingress on quinn and h3 (experimental, ADR-0032). Off by default and in release builds:
# without it a listener with `http3.enabled: true` is refused with a diagnostic.
http3 = ["rdock-proxy/http3", "rdock-testkit/http3"]
# jemalloc (tikv-jemallocator) as the global allocator, to compare with mimalloc (H-PERF-06,
# ADR-0031; benchmarks/README.md, "Allocator comparison"). Wins over `mimalloc` when both are on, so
# `--features jemalloc` on a default build is enough. Off by default and never in a published
# binary. Builds jemalloc from C source: needs `make` and a C compiler.
jemalloc = ["dep:tikv-jemallocator"]
# Faults for the admin isolation test (benchmarks/isolation, H-ENG-04); never in release builds.
fault-injection = ["rdock-admin/fault-injection"]
# Counts allocations for the per-request measurement helper (benchmarks/perreq): the system
# allocator wrapped in a counter, readable over the Unix socket named by
# `RDOCK_ALLOC_COUNT_SOCKET`. Replaces mimalloc while on. Debug builds only (a release build with
# it fails to compile); never in a published binary.
alloc-count = ["dep:stats_alloc"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["env"] }
notify.workspace = true
notify-debouncer-full.workspace = true
rdock-acme.workspace = true
rdock-balancer.workspace = true
rdock-admin.workspace = true
rdock-cloudflare.workspace = true
rdock-cluster.workspace = true
rdock-control.workspace = true
rdock-config.workspace = true
rdock-credentials.workspace = true
rdock-dns-providers.workspace = true
rdock-middleware.workspace = true
rdock-migrate.workspace = true
rdock-model.workspace = true
rdock-observability.workspace = true
rdock-plugin-api.workspace = true
rdock-provider-docker = { workspace = true, optional = true }
rdock-provider-swarm = { workspace = true, optional = true }
rdock-provider-kubernetes = { workspace = true, optional = true }
rdock-proxy.workspace = true
rdock-wasm.workspace = true
rdock-cache.workspace = true
rdock-limits.workspace = true
rdock-tls.workspace = true
# Safe SCM_RIGHTS for the binary-upgrade handover (ADR-0031): received descriptors arrive as
# `OwnedFd`; `fs` for opening the new binary without following a link. Already in the tree through tempfile, cap-std and others; 1.1.6 fixes
# RUSTSEC-2026-0486 (xattr functions, not used here). Apache-2.0 WITH LLVM-exception OR
# Apache-2.0 OR MIT (checked 2026-11-13).
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "net", "process"] }
base64.workspace = true
thiserror.workspace = true
sd-notify.workspace = true
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
stats_alloc = { workspace = true, optional = true }
nix.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
ring.workspace = true
serde_path_to_error.workspace = true
serde-saphyr.workspace = true
http.workspace = true

[dev-dependencies]
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util = "0.3.34"
h2.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonschema.workspace = true
rdock-testkit.workspace = true
regex.workspace = true
rdock-wasm = { workspace = true, features = ["testing"] }
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
zstd.workspace = true

[lints]
workspace = true
