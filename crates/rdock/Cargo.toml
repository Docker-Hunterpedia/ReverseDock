[package]
name = "rdock"
description = "ReverseDock: one reverse proxy for every dock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "rdock"
path = "src/main.rs"

[features]
default = ["docker"]
# The Docker provider (bollard). Off: a build that reads only files.
docker = ["dep:rdock-provider-docker"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["env"] }
notify.workspace = true
notify-debouncer-full.workspace = true
rdock-acme.workspace = true
rdock-balancer.workspace = true
rdock-admin.workspace = true
rdock-cloudflare.workspace = true
rdock-config.workspace = true
rdock-middleware.workspace = true
rdock-migrate.workspace = true
rdock-model.workspace = true
rdock-observability.workspace = true
rdock-provider-docker = { workspace = true, optional = true }
rdock-proxy.workspace = true
sd-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util = "0.3.34"
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rdock-testkit.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
zstd.workspace = true

[lints]
workspace = true
