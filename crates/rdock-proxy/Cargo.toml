[features]
# Sandboxed WASM plugins on wasmtime (experimental, ADR-0030).
wasm = ["rdock-middleware/wasm"]
# HTTP/3 ingress on quinn and h3 (experimental, ADR-0032). Off by default: without it a listener
# with `http3.enabled: true` is refused with a diagnostic.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dev-dependencies]
http-body-util.workspace = true
jsonschema.workspace = true
rdock-testkit.workspace = true
tempfile.workspace = true

