[package]
name = "rdock-plugin-api"
description = "The API a native ReverseDock plugin is written against: the Plugin trait, typed request and response heads, decisions, per-request state, factories and a test harness"
# Its own version line, independent of the proxy's (ADR-0030): 0.x, may change until 1.0.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"

# Only `http`-crate types and std in the public API: nothing from Pingora or from the proxy's
# own crates, so a Pingora upgrade does not break plugins.
[dependencies]
async-trait.workspace = true
bytes.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
