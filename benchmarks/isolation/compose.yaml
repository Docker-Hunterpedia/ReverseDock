# Isolation lab (H-ENG-04): rdock built with the `fault-injection` feature in front of the
# benchmark backend, k6 load on the proxy, and attack.py on the admin API from rdock's network
# namespace. run.sh drives it.
name: rdock-isolation

services:
  backend:
    image: nginx:1.29.3-alpine
    cpus: "2"
    volumes:
      - ../backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../backend/index.html:/usr/share/nginx/html/index.html:ro
    networks: [lab]

  rdock:
    image: ${RDOCK_IMAGE:-rdock:fault}
    cpus: "2"
    mem_limit: 1g
    command: ["run", "--config", "/etc/rdock/rdock.yaml"]
    environment:
      RDOCK_FAULT: ${RDOCK_FAULT:-}
    volumes:
      - ./rdock.yaml:/etc/rdock/rdock.yaml:ro
      - data:/var/lib/rdock
    depends_on: [backend]
    networks: [lab]

  attack:
    image: python:3.14.0-alpine
    profiles: [attack]
    network_mode: service:rdock
    cpus: "1"
    volumes:
      - ./attack.py:/attack.py:ro
      - ./work:/work:ro
    entrypoint: ["python3", "-I", "/attack.py"]

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpus: "2"
    volumes:
      - ../load.js:/scripts/load.js:ro
      - ./work/results:/results
    networks: [lab]

volumes:
  data: {}

networks:
  lab: {}
