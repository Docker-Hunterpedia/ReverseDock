# Soak lab: rdock in front of three backends, k6 load, and a probe that shares rdock's PID
# namespace to sample its memory, threads, file descriptors and connections.
name: rdock-soak

x-backend: &backend
  image: nginx:1.29.3-alpine
  cpus: "1"
  volumes:
    - ../backend/nginx.conf:/etc/nginx/nginx.conf:ro
    - ../backend/index.html:/usr/share/nginx/html/index.html:ro
  networks: [soak]

services:
  b1: *backend
  b2: *backend
  b3: *backend

  rdock:
    image: ${RDOCK_IMAGE:-rdock:bench}
    cpus: "2"
    mem_limit: 1g
    command: ["run", "--config", "/etc/rdock/rdock.yaml"]
    volumes:
      - ./work/config:/etc/rdock:ro
    depends_on: [b1, b2, b3]
    networks: [soak]

  probe:
    image: busybox:1.37.0
    pid: "service:rdock"
    user: "65532:65532"
    environment:
      EVERY: ${PROBE_EVERY:-30}
    command: ["sh", "/probe.sh"]
    volumes:
      - ./probe.sh:/probe.sh:ro
      - ./work:/out
    depends_on: [rdock]
    network_mode: none

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpus: "2"
    volumes:
      - ./soak.js:/scripts/soak.js:ro
      - ./work/windows:/windows
    networks: [soak]

networks:
  soak: {}
