# NGINX: HTTPS with upstream keep-alive; no access log.
# TLS parity (README "TLS parity"): TLS 1.3 only, X25519 only, TLS_AES_128_GCM_SHA256 only,
# HTTP/2 offered next to HTTP/1.1 with 100 concurrent streams (NGINX's default is 128).
worker_processes 2;
events { worker_connections 8192; }
http {
  access_log off;
  upstream backend { server backend:80; keepalive 256; }
  server {
    listen 8080 ssl;
    http2 on;
    http2_max_concurrent_streams 100;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
