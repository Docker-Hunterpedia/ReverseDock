# HAProxy: HTTPS with connection reuse; no logging.
# TLS parity (README "TLS parity"): TLS 1.3 only, X25519 only, TLS_AES_128_GCM_SHA256 only (HAProxy
# enforces the server's cipher order by default). ALPN defaults to "h2,http/1.1" on an HTTPS bind
# and HTTP/2 allows 100 concurrent streams by default (configuration manual 3.4, read 2026-11-14).
global
  nbthread 2
  maxconn 20000
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  option http-keep-alive
  http-reuse always
frontend web
  bind :8080 ssl crt /certs/combined.pem ssl-min-ver TLSv1.3 ciphersuites TLS_AES_128_GCM_SHA256 curves X25519
  default_backend app
backend app
  server backend backend:80
