# HAProxy: round-robin over three backends with connection reuse; no logging.
global
  nbthread 2
  maxconn 20000
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  option http-keep-alive
  http-reuse always
frontend web
  bind :8080
  default_backend app
backend app
  balance roundrobin
  server b1 backend:80
  server b2 backend-2:80
  server b3 backend-3:80
