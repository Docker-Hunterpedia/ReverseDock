# NGINX: round-robin (the default) over three backends with upstream keep-alive; no access log.
worker_processes 2;
events { worker_connections 8192; }
http {
  access_log off;
  upstream backend {
    server backend:80;
    server backend-2:80;
    server backend-3:80;
    keepalive 256;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
