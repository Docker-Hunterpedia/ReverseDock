# NGINX, tuned: ../nginx.conf plus, each from NGINX's own documentation (read 2026-11-14):
#   worker_cpu_affinity auto   binds each worker to one of the available CPUs
#                              (https://nginx.org/en/docs/ngx_core_module.html#worker_cpu_affinity)
#   listen ... reuseport       one listening socket per worker, the kernel spreads connections;
#                              "reduce lock contention ... improve performance on multicore
#                              systems" (https://nginx.org/en/docs/http/ngx_http_core_module.html#listen;
#                              F5 blog "Socket Sharding in NGINX Release 1.9.1", 2015-05-26)
#   keepalive_requests 100000  client and upstream: "a much higher value can be especially useful
#                              for testing with a load-generation tool" (F5 blog "Tuning NGINX for
#                              Performance", 2014-10-10; directive defaults are 1000)
worker_processes 2;
worker_cpu_affinity auto;
events { worker_connections 8192; }
http {
  access_log off;
  keepalive_requests 100000;
  upstream backend { server backend:80; keepalive 256; keepalive_requests 100000; }
  server {
    listen 8080 reuseport;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
