# NGINX, tuned, HTTPS: ../../tls/nginx.conf (TLS parity) plus ../nginx.conf's tuning and
#   ssl_session_cache shared:SSL:10m   the "HTTPS server optimization" section's shared session
#                                      cache (https://nginx.org/en/docs/http/configuring_https_servers.html,
#                                      read 2026-11-14). k6 does not resume sessions, so it
#                                      changes nothing measured here; it is what the page recommends.
worker_processes 2;
worker_cpu_affinity auto;
events { worker_connections 8192; }
http {
  access_log off;
  keepalive_requests 100000;
  ssl_session_cache shared:SSL:10m;
  upstream backend { server backend:80; keepalive 256; keepalive_requests 100000; }
  server {
    listen 8080 ssl reuseport;
    http2 on;
    http2_max_concurrent_streams 100;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
