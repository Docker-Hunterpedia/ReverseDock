# TLS parity (README "TLS parity"): TLS 1.3 only and X25519 only. TLS 1.3 cipher suites are not
# configurable in Traefik (Go chooses); HTTP/2 is on by default, its stream limit is set in
# traefik.yml.
tls:
  certificates:
    - { certFile: /certs/cert.pem, keyFile: /certs/key.pem }
  stores:
    default:
      defaultCertificate: { certFile: /certs/cert.pem, keyFile: /certs/key.pem }
  options:
    default:
      minVersion: VersionTLS13
      curvePreferences: [X25519]
http:
  routers:
    app: { rule: "PathPrefix(`/`)", service: app, entryPoints: [web], tls: {} }
  services:
    app:
      loadBalancer:
        servers: [{ url: "http://backend:80" }]
