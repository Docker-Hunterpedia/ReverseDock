# HAProxy, tuned, HTTPS: the same as ../../tls/haproxy.cfg, for the reasons in ../haproxy.cfg.
global
  nbthread 2
  maxconn 20000
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  option http-keep-alive
  http-reuse always
frontend web
  bind :8080 ssl crt /certs/combined.pem ssl-min-ver TLSv1.3 ciphersuites TLS_AES_128_GCM_SHA256 curves X25519
  default_backend app
backend app
  server backend backend:80
