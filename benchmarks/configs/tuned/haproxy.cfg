# HAProxy, tuned: the same as ../haproxy.cfg, on purpose. HAProxy's configuration manual (3.4,
# read 2026-11-14) documents the defaults that matter here as the recommended ones: nbthread
# defaults to the CPUs the process is bound to, cpu-policy "performance" is the default, and for
# tune.h2.fe.max-concurrent-streams "the default value of 100 is generally good and it is
# recommended not to change this value". `http-reuse always` is already in the default file.
global
  nbthread 2
  maxconn 20000
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  option http-keep-alive
  http-reuse always
frontend web
  bind :8080
  default_backend app
backend app
  server backend backend:80
