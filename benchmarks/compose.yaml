# Benchmark lab: backends, five proxies with equivalent configurations, and k6.
# Each proxy gets the same CPU and memory limits; `run.sh` starts one proxy at a time.
# CONFIGS picks the scenario's configurations (configs/ or configs/lb/); in the `lb` scenario
# three backends share the 4 CPUs one backend has otherwise (BACKEND_CPUS).
name: rdock-bench

x-proxy: &proxy
  cpus: "2"
  mem_limit: 1g
  depends_on: [backend]
  networks: [bench]

services:
  backend: &backend
    image: nginx:1.29.3-alpine
    cpus: ${BACKEND_CPUS:-4}
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/index.html:/usr/share/nginx/html/index.html:ro
    networks: [bench]

  backend-2:
    <<: *backend
    profiles: [lb]

  backend-3:
    <<: *backend
    profiles: [lb]

  rdock:
    <<: *proxy
    image: ${RDOCK_IMAGE:-rdock:bench}
    profiles: [rdock]
    command: ["run", "--config", "/etc/rdock/rdock.yaml"]
    volumes:
      - ${CONFIGS:-./configs}/rdock.yaml:/etc/rdock/rdock.yaml:ro

  nginx:
    <<: *proxy
    image: nginx:1.29.3-alpine
    profiles: [nginx]
    volumes:
      - ${CONFIGS:-./configs}/nginx.conf:/etc/nginx/nginx.conf:ro

  traefik:
    <<: *proxy
    image: traefik:v3.5.4
    profiles: [traefik]
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./configs/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${CONFIGS:-./configs}/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  caddy:
    <<: *proxy
    image: caddy:2.10.2-alpine
    profiles: [caddy]
    volumes:
      - ${CONFIGS:-./configs}/Caddyfile:/etc/caddy/Caddyfile:ro

  haproxy:
    <<: *proxy
    image: haproxy:3.2.8-alpine
    profiles: [haproxy]
    volumes:
      - ${CONFIGS:-./configs}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpus: "4"
    networks: [bench]
    volumes:
      - ./load.js:/scripts/load.js:ro
      - ./results:/results

networks:
  bench: {}
