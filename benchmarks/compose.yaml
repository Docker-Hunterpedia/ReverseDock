# Benchmark lab: backends, five proxies with equivalent configurations, and k6.
# Each proxy gets the same CPU and memory limits; `run.sh` starts one proxy at a time.
# CONFIGS picks the scenario's configurations; in the `lb` scenario three backends share the 4
# CPUs one backend has otherwise (BACKEND_CPUS). run.sh explains the scenarios.
# compose.pinned.yaml adds CPU pinning (cpuset) for hosted runners (PIN=1 in run.sh).
#
# Every image is pinned by tag and digest. The digest is the multi-platform index digest read on
# 2026-11-14 from the registry (registry-1.docker.io `HEAD /v2/<repo>/manifests/<tag>`, header
# `Docker-Content-Digest`, and the same value in Docker Hub's tag API); versions are the newest
# stable releases on that day:
#   NGINX 1.30.6   stable branch, https://nginx.org/en/download.html (mainline is 1.31.8)
#   HAProxy 3.4.7  LTS, released 2026-10-14, https://www.haproxy.org/
#   Traefik 3.7.19 newest v3.7 image on Docker Hub (pushed 2026-11-13; v3.8.0 is a release candidate)
#   Caddy 2.11.9   newest 2.11 image on Docker Hub (pushed 2026-11-13)
#   k6 1.8.3       newest v1 release (pushed 2026-11-13); k6 2.x (2.4.0) is a new major whose
#                  script compatibility with load.js has not been checked
# run.sh writes the digests Docker actually resolved to images.txt next to the results.
name: rdock-bench

x-proxy: &proxy
  cpus: "2"
  mem_limit: 1g
  networks: [bench]

services:
  backend: &backend
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    cpus: ${BACKEND_CPUS:-4}
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/index.html:/usr/share/nginx/html/index.html:ro
      - ./backend/bodies:/usr/share/nginx/html/bodies:ro
    networks: [bench]

  # `slow` scenario: answers after ?wait=100ms, under the same name as the usual backend.
  backend-slow:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    cpus: "4"
    profiles: [slow]
    networks:
      bench:
        aliases: [backend]

  backend-2:
    <<: *backend
    profiles: [lb]

  backend-3:
    <<: *backend
    profiles: [lb]

  rdock:
    <<: *proxy
    image: ${RDOCK_IMAGE:-rdock:bench}
    profiles: [rdock]
    command: ["run", "--config", "/etc/rdock/rdock.yaml"]
    volumes:
      - ${CONFIGS:-./configs}/rdock.yaml:/etc/rdock/rdock.yaml:ro
      - ${CERTS:-./configs/tls/certs}:/certs:ro

  nginx:
    <<: *proxy
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    profiles: [nginx]
    volumes:
      - ${CONFIGS:-./configs}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CERTS:-./configs/tls/certs}:/certs:ro

  traefik:
    <<: *proxy
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    profiles: [traefik]
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      # Static configuration: configs/traefik.yml, or configs/tuned/traefik.yml (run.sh).
      - ${TRAEFIK_STATIC:-./configs/traefik.yml}:/etc/traefik/traefik.yml:ro
      - ${CONFIGS:-./configs}/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${CERTS:-./configs/tls/certs}:/certs:ro

  caddy:
    <<: *proxy
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: [caddy]
    volumes:
      - ${CONFIGS:-./configs}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CERTS:-./configs/tls/certs}:/certs:ro

  haproxy:
    <<: *proxy
    image: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    profiles: [haproxy]
    volumes:
      - ${CONFIGS:-./configs}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${CERTS:-./configs/tls/certs}:/certs:ro

  k6:
    image: grafana/k6:1.8.3@sha256:2cd9cd09e4119340a122aaf06f30cf3009c19db23b87954909fba0d3eda58e08
    profiles: [load]
    cpus: "4"
    networks: [bench]
    volumes:
      - ./load.js:/scripts/load.js:ro
      - ./results:/results

networks:
  bench: {}
