# cargo-deny: licenses, advisories, bans and sources. Run `just deny` (CI: `deny` job).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Pingora 0.9.0 transitive dependencies without a fixed release. Re-check on every Pingora bump.
ignore = [
  { id = "RUSTSEC-2024-0388", reason = "derivative (unmaintained proc-macro) via pingora-core 0.9.0; upstream cloudflare/pingora#889" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile (unmaintained) via pingora-rustls 0.9.0 and rustls-native-certs 0.7; our code parses PEM with rustls-pki-types; upstream cloudflare/pingora#1011" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (unmaintained) via serde_yaml in pingora-core 0.9.0; ReverseDock builds ServerConf in code and never loads Pingora YAML; upstream cloudflare/pingora#1058" },
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 via pingora-header-serde (pingora-cache); the affected stream with_context constructors are never called; upstream cloudflare/pingora#1073" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 via pingora-header-serde; Seekable needs the `seekable` feature, which is off; upstream cloudflare/pingora#1073" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 via pingora-header-serde; it only uses the bulk API, not DCtx::decompress_stream; upstream cloudflare/pingora#1073" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Allowances kept for dependencies that arrive with Pingora and TLS crates.
unused-allowed-license = "allow"
# Permissive licenses compatible with Apache-2.0 distribution.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# CC0-1.0 grants no patent licence, so it is allowed per crate, not globally.
exceptions = [
  # Build time only: const-random-macro (proc-macro) <- ahash "compile-time-rng" <- Pingora.
  { crate = "tiny-keccak", allow = ["CC0-1.0"] },
  # File watching for the file provider (B-CFG-07).
  { crate = "notify", allow = ["CC0-1.0"] },
  # Mozilla's root certificate list, used by rustls-platform-verifier <- hyper-rustls <- instant-acme
  # to reach ACME CAs (ADR-0020). CDLA-Permissive-2.0 is a permissive data licence.
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
  # Quoted-printable encoding for SMTP alert mail, via lettre (#106). 0BSD is public-domain-like
  # with no patent clause, so it is allowed for this crate only.
  { crate = "quoted_printable", allow = ["0BSD"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# One TLS stack: rustls with ring (ADR-0013). A default feature must never bring another in (ADR-0024).
deny = [
  { name = "openssl", reason = "rustls with ring only (ADR-0013)" },
  { name = "openssl-sys", reason = "rustls with ring only (ADR-0013)" },
  { name = "native-tls", reason = "rustls with ring only (ADR-0013)" },
  { name = "aws-lc-rs", reason = "ring is the only crypto provider (ADR-0013)" },
  { name = "aws-lc-sys", reason = "ring is the only crypto provider (ADR-0013)" },
  # The data plane never depends on the admin API (ADR-0009, ADR-0024, H-ENG-04): only the
  # binary wires the two together.
  { name = "rdock-admin", wrappers = ["rdock"], reason = "only the binary may depend on the admin API (ADR-0024)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
