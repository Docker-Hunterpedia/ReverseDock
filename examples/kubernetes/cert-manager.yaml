# REQUIRES cert-manager (https://cert-manager.io), which this project does not install.
# It fills the Secret that gateway.yaml names. The Issuer is a self-signed one for trying things
# out; replace it with an ACME issuer for real certificates.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: default
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-com
  namespace: default
spec:
  secretName: example-com-tls
  dnsNames:
    - "*.example.com"
    - example.com
  issuerRef:
    name: selfsigned
    kind: Issuer
