# REQUIRES External Secrets Operator (https://external-secrets.io), which this project does not
# install, and a store. NOT exercised by CI. The store's own configuration is out of scope: a
# ClusterSecretStore named `example` is assumed to exist and to hold the keys used below.
#
# 1. A Secret that ReverseDock reads as files (see external-secrets-values.yaml).
# 2. A kubernetes.io/tls Secret for the Gateway of examples/kubernetes/gateway.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rdock-alert-token
  namespace: reversedock-system   # the namespace ReverseDock's pods run in
spec:
  secretStoreRef:
    name: example
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: rdock-secrets           # the Secret the pod mounts
    creationPolicy: Owner
  data:
    - secretKey: alert-token      # becomes the file /etc/rdock-secrets/alert-token
      remoteRef:
        key: rdock/alerts         # the store's own path syntax
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-com-tls
  namespace: default              # the Gateway's namespace
spec:
  secretStoreRef:
    name: example
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: example-com-tls         # the name gateway.yaml refers to
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
  data:
    - secretKey: certificate
      remoteRef:
        key: tls/example-com
        property: certificate
    - secretKey: private_key
      remoteRef:
        key: tls/example-com
        property: private_key
