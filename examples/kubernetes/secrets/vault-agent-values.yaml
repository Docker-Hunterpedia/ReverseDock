# Helm values for deploy/helm/reversedock with the Vault Agent Injector
# (https://developer.hashicorp.com/vault/docs/deploy/kubernetes/injector). The injector adds an
# agent that renders /vault/secrets/<name> into a shared volume. The Vault side (the Kubernetes
# auth method, a role named rdock bound to ReverseDock's service account, a policy) is out of
# scope. NOT exercised by CI.
podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "rdock"
  vault.hashicorp.com/agent-inject-secret-alert-token: "secret/data/rdock/alerts"
  vault.hashicorp.com/agent-inject-template-alert-token: |
    {{- with secret "secret/data/rdock/alerts" -}}
    {{ .Data.data.token }}
    {{- end }}

config:
  extra:
    observability:
      alerts:
        channels:
          pager:
            type: webhook
            url: https://alerts.example.com/rdock
            token: "${file:/vault/secrets/alert-token}"
