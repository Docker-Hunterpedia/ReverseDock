# Helm values for deploy/helm/reversedock: mount the Secret that external-secrets.yaml produces
# and refer to its file. NOT exercised by CI.
#   helm upgrade --install reversedock deploy/helm/reversedock -n reversedock-system \
#     -f examples/kubernetes/secrets/external-secrets-values.yaml
extraVolumes:
  - name: rdock-secrets
    secret:
      secretName: rdock-secrets     # a plain volume, never subPath: subPath mounts get no updates
extraVolumeMounts:
  - name: rdock-secrets
    mountPath: /etc/rdock-secrets
    readOnly: true

config:
  extra:
    observability:
      alerts:
        channels:
          pager:
            type: webhook
            url: https://alerts.example.com/rdock
            # Read again for every delivery: a rotated token needs no reload.
            token: "${file:/etc/rdock-secrets/alert-token}"
