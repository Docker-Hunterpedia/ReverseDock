# Helm values for deploy/helm/reversedock with the SecretProviderClass of secrets-store-csi.yaml.
# The CSI volume is mounted read-only; each objectName becomes a file. NOT exercised by CI.
extraVolumes:
  - name: rdock-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: rdock-secrets
extraVolumeMounts:
  - name: rdock-secrets
    mountPath: /etc/rdock-secrets
    readOnly: true

config:
  extra:
    observability:
      alerts:
        channels:
          pager:
            type: webhook
            url: https://alerts.example.com/rdock
            token: "${file:/etc/rdock-secrets/alert-token}"
