# REQUIRES the Secrets Store CSI driver (https://secrets-store-csi-driver.sigs.k8s.io) and a
# provider for your store. This one uses the Vault provider; replace `provider` and
# `parameters` for another store. NOT exercised by CI.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rdock-secrets
  namespace: reversedock-system
spec:
  provider: vault
  parameters:
    roleName: rdock
    # vaultAddress: https://vault.example.com:8200   # when the provider's Helm chart sets none
    objects: |
      - objectName: "alert-token"
        secretPath: "secret/data/rdock/alerts"
        secretKey: "token"
