# ReverseDock reading a secret that an OpenBao Agent renders to a file. NOT exercised by CI.
# The OpenBao (or Vault) server, its AppRole and policy are out of scope: put the role ID and
# secret ID in ./approle/role-id and ./approle/secret-id (mode 0600) and set the address in
# agent.hcl. For Vault use its image and `vault agent`; the agent configuration is the same.
name: rdock-secrets

services:
  agent:
    image: openbao/openbao:2.7.2
    restart: unless-stopped
    command: ["bao", "agent", "-config=/etc/openbao/agent.hcl"]
    volumes:
      - ./agent.hcl:/etc/openbao/agent.hcl:ro
      - ./backend-key.ctmpl:/etc/openbao/backend-key.ctmpl:ro
      - ./approle:/etc/openbao/approle:ro
      - rendered:/rendered
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  rdock:
    image: ghcr.io/docker-hunterpedia/rdock:0.9.0-alpha.1
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./config:/etc/rdock:ro
      - rendered:/run/rendered:ro
      - rdock-data:/var/lib/rdock
    depends_on: [agent]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  rendered:
  rdock-data:
