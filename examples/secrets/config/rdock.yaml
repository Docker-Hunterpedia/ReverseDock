# yaml-language-server: $schema=https://raw.githubusercontent.com/Docker-Hunterpedia/ReverseDock/main/schema/rdock.v1.json
#
# The key is read when the configuration is loaded. After the agent renders a new value, run
# `docker compose exec rdock rdock reload` (a file read through ${file:...} is not watched).
listeners:
  web: { address: ":80" }

defaults:
  listeners: [web]
  tls: off

acme: false

routes:
  app:
    match: "Host(`app.example.com`)"
    service: app
    middlewares: [backend-key]

middlewares:
  backend-key:
    type: headers
    request:
      set:
        X-Api-Key: "${file:/run/rendered/backend-key}"

services:
  app:
    backends: [{ address: "app:3000" }]
