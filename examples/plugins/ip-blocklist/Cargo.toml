[package]
name = "ip-blocklist"
description = "Example ReverseDock plugin: refuse client addresses from a list of networks with 403"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

# Outside this repository, depend on the plugin API through git (the crates are not published
# on crates.io):
#   rdock-plugin-api = { git = "https://github.com/Docker-Hunterpedia/ReverseDock", tag = "v1.0.0-rc.1" }
[dependencies]
rdock-plugin-api = { path = "../../../crates/rdock-plugin-api" }
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
