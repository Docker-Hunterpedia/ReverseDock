# Required checks for main: docs (incl. actionlint), dco, pr-title, rust, msrv, deny, docker,
# clients. semgrep, waf-example, wasm and http3 report only.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Check links, generated matrix and GitHub YAML
        run: python scripts/check-docs.py
      - name: Install actionlint (pinned release, checksum verified)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows (actionlint with shellcheck)
        run: '"$RUNNER_TEMP/actionlint" -color'

  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git show -s --format='%an' "$sha")
            email=$(git show -s --format='%ae' "$sha")
            case "$name$email" in *"[bot]"*) echo "skip bot commit $sha ($name)"; continue;; esac
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $name <$email>" \
               || git show -s --format='%B' "$sha" | grep -qi "^Signed-off-by: .*<$email>"; then
              echo "ok   $sha"
            else
              echo "::error::Commit $sha by $name <$email> has no matching Signed-off-by line. Fix with: git rebase --signoff $BASE && git push --force-with-lease"
              status=1
            fi
          done
          exit $status

  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|perf|refactor|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?: .+'
          # The title is untrusted: it is only read from the environment and never echoed, so it
          # cannot be interpreted as a workflow command.
          if [[ "$TITLE" =~ $re ]]; then
            echo "The PR title is a Conventional Commit."
          else
            echo "::error::The PR title must look like 'type(scope): summary', e.g. 'feat(docker): select network by label'."
            exit 1
          fi

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just,cargo-nextest
      - name: Format
        run: just fmt-check
      - name: Clippy (warnings are errors)
        run: just clippy
      - name: Tests (unit, integration, property, doc; includes schema freshness)
        run: just test
        env:
          # The runner's Docker daemon: the Docker provider end-to-end test (e2e_docker.rs).
          RDOCK_DOCKER_TESTS: "1"
          # Pebble (Let's Encrypt's test CA) in Docker: the ACME end-to-end test (e2e_acme.rs).
          RDOCK_ACME_TESTS: "1"
          # Toxiproxy in Docker: the chaos suite (chaos.rs).
          RDOCK_CHAOS_TESTS: "1"
          # A single-node swarm on the runner's daemon: the Swarm provider end-to-end test
          # (e2e_swarm.rs); it leaves the swarm it created.
          RDOCK_SWARM_TESTS: "1"
      - name: API docs build without warnings
        run: just doc

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just
      - name: Check with the minimum supported Rust version
        run: just msrv

  # WASM plugins (experimental, cargo feature `wasm`, ADR-0030): not required, and kept out of
  # the `rust` job so the default build and its time are unaffected.
  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
          workspaces: |
            .
            examples/plugins/wasm-header
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just
      - name: Clippy, the example guest, WASM tests and MSRV with the feature
        run: just wasm

  # HTTP/3 ingress (experimental, cargo feature `http3`, ADR-0032): not required, and kept out
  # of the `rust` job so the default build and its time are unaffected. Clippy, the unit and
  # end-to-end tests and the MSRV check with the feature, then curl over HTTP/3 from a pinned
  # image against a running rdock. The h3i malformed-request suite is planned.
  http3:
    name: http3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: http3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just
      - name: Clippy, tests and MSRV with the feature
        run: just http3
      - name: curl over HTTP/3 against a running rdock
        run: |
          cargo build --locked -p rdock --features http3
          scripts/http3-curl.sh

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny
      - name: Licenses, advisories, bans and sources
        run: cargo deny check

  clients:
    name: clients
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @reversedock/dashboard...
      - name: Generated clients match schema/openapi.json (F-MGMT-01)
        run: |
          pnpm --dir apps/dashboard gen:api
          (cd clients/go && go generate ./... && go vet ./...)
          git diff --exit-code -- apps/dashboard/src/api clients/go || { echo "::error::Run 'just clients' and commit the result"; exit 1; }

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --filter @reversedock/dashboard...
          pnpm --dir apps/dashboard exec playwright install --with-deps chromium
      - name: Build the dashboard, then rdock, which embeds it
        run: |
          pnpm --dir apps/dashboard build
          cargo build --locked -p rdock
      - name: Bundle budget and licences
        run: |
          pnpm --dir apps/dashboard check:budget
          pnpm --dir apps/dashboard check:licenses
      - name: Known vulnerabilities in production npm dependencies
        run: pnpm --dir apps/dashboard audit --prod
      - name: Every page, both themes, 400 to 1440 px (axe, no requests off the origin)
        run: pnpm --dir apps/dashboard check:pages
      - name: Lighthouse on Overview
        run: pnpm --dir apps/dashboard check:lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dashboard-screenshots
          path: apps/dashboard/e2e/screenshots/
          retention-days: 14

  # The Terraform/OpenTofu provider (F-MGMT-02, clients/terraform). Not a required check. The
  # provider's CLI-driven tests run against its in-process fake of the admin API with Terraform
  # and with OpenTofu, then against a real rdock built from this commit with both.
  terraform-provider:
    name: terraform-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/terraform/go.mod
          cache-dependency-path: |
            clients/terraform/go.sum
            clients/go/go.sum
      # The wrappers are off: the tests call the binaries through terraform-exec, which needs
      # their real output.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Vet, gofmt, tidy, unit tests, generated docs up to date
        working-directory: clients/terraform
        run: make check
      - name: Examples validate with Terraform and OpenTofu (provider as a development override)
        working-directory: clients/terraform
        run: |
          make build
          cat > "$RUNNER_TEMP/dev.tfrc" <<EOF
          provider_installation {
            dev_overrides { "Docker-Hunterpedia/reversedock" = "$PWD" }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/dev.tfrc"
          for cli in terraform tofu; do
            for dir in examples/provider examples/complete examples/import; do
              "$cli" -chdir="$dir" validate
            done
          done
      - name: CLI-driven tests against the fake admin API (Terraform, then OpenTofu)
        working-directory: clients/terraform
        run: |
          TF_ACC=1 TF_ACC_TERRAFORM_PATH="$(command -v terraform)" go test ./... -count=1 -timeout 20m
          TF_ACC=1 TF_ACC_TERRAFORM_PATH="$(command -v tofu)" TF_ACC_PROVIDER_HOST=registry.opentofu.org \
            go test ./... -count=1 -timeout 20m
      - name: Build rdock
        run: cargo build --locked -p rdock
      - name: CLI-driven tests against a real rdock (Terraform, then OpenTofu)
        run: |
          RDOCK_DATA_DIR="$(mktemp -d)"
          export RDOCK_DATA_DIR
          config="$PWD/clients/terraform/testdata/rdock.yaml"
          log="$RUNNER_TEMP/rdock.log"
          target/debug/rdock run --config "$config" > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$log"' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:12080/healthz > /dev/null && break
            kill -0 "$pid" || { echo "::error::rdock exited during start"; exit 1; }
            sleep 0.5
          done
          curl -sf http://127.0.0.1:12080/healthz
          # Over the admin socket in $RDOCK_DATA_DIR, which needs no token and no user. The
          # token is the first line of the output; the second line is a reminder.
          output="$(target/debug/rdock tokens create terraform-acc --role operator --days 1 --config "$config")"
          token="$(printf '%s\n' "$output" | sed -n 1p)"
          # The token is valid for one day on this job's own rdock, which listens on loopback and
          # ends with the job. It is never printed.
          export RDOCK_ADMIN_URL=http://127.0.0.1:12080
          export RDOCK_ADMIN_TOKEN="$token"
          cd clients/terraform
          TF_ACC=1 TF_ACC_TERRAFORM_PATH="$(command -v terraform)" go test ./... -count=1 -timeout 20m
          TF_ACC=1 TF_ACC_TERRAFORM_PATH="$(command -v tofu)" TF_ACC_PROVIDER_HOST=registry.opentofu.org \
            go test ./... -count=1 -timeout 20m

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --build-arg "RDOCK_BUILD_COMMIT=${GITHUB_SHA}" --tag rdock:ci .
      - name: Smoke test
        run: |
          docker run --rm rdock:ci version
          docker run --rm -v "$PWD/examples/config:/cfg:ro" rdock:ci validate --strict /cfg/rdock.quickstart.yaml
          docker run --rm -v "$PWD/examples/config:/cfg:ro" rdock:ci validate /cfg/rdock.full.yaml /cfg/rdock.tcp.yaml /cfg/rdock.udp.yaml
      - name: Docker provider examples (deploy/docker/examples)
        run: |
          for dir in deploy/docker/examples/*/; do
            docker run --rm -v "$PWD/${dir}config:/cfg:ro" rdock:ci validate --strict /cfg/rdock.yaml
            DOCKER_GID=0 docker compose -f "${dir}compose.yaml" config --quiet
          done
      - name: Run the image (read-only, no capabilities) and stop it gracefully
        run: |
          docker run -d --name rdock-smoke --read-only --cap-drop ALL \
            -v "$PWD/deploy/docker/config:/etc/rdock:ro" -v rdock-smoke-data:/var/lib/rdock rdock:ci
          for _ in $(seq 1 30); do
            if docker exec rdock-smoke /usr/local/bin/rdock healthcheck; then break; fi
            sleep 1
          done
          docker exec rdock-smoke /usr/local/bin/rdock healthcheck
          docker stop rdock-smoke
          test "$(docker inspect rdock-smoke --format '{{.State.ExitCode}}')" = 0 || { docker logs rdock-smoke; exit 1; }

  # The roadmap's WAF proof (ADR-0030): the CRS project's ModSecurity image as an rdock
  # `forward` agent in examples/waf; a clean request passes, attacks get 403, a stopped WAF
  # fails closed. Not a required check: it pulls third-party images from Docker Hub.
  waf-example:
    name: waf-example
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (as the docker job does)
        run: docker build --build-arg "RDOCK_BUILD_COMMIT=${GITHUB_SHA}" --tag rdock:ci .
      - name: The example configuration validates
        run: docker run --rm -v "$PWD/examples/waf:/cfg:ro" rdock:ci validate /cfg/rdock.yaml
      - name: Smoke test (Compose; CRS WAF as a forward agent)
        run: ./examples/waf/smoke.sh
        env:
          RDOCK_IMAGE: rdock:ci

  openbao:
    name: openbao
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Started by a step rather than as a service container: a service's environment is fixed
      # before any step runs, and the dev root token must be generated in this job. It is a
      # throw-away for a dev server on loopback that ends with the job, and it is never printed.
      - name: Start OpenBao 2.7.2 in dev mode (KV v2 at secret/)
        run: |
          token="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          docker run -d --name openbao --network host \
            -e BAO_DEV_ROOT_TOKEN_ID="$token" -e BAO_DEV_LISTEN_ADDRESS=127.0.0.1:8200 \
            openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f \
            server -dev > /dev/null
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null
          echo "RDOCK_OPENBAO_TOKEN=$token" >> "$GITHUB_ENV"
      - name: "${vault:…} against a real OpenBao (e2e_vault.rs, ignored elsewhere)"
        run: cargo test --locked -p rdock --test e2e_vault -- --ignored --nocapture
        env:
          RDOCK_OPENBAO_ADDR: http://127.0.0.1:8200
      - name: OpenBao log (without the dev server's token and unseal key lines)
        if: failure()
        run: docker logs openbao 2>&1 | grep -v -i -e 'root token' -e 'unseal key' | tail -n 100

  oidc-dex:
    name: oidc-dex
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install htpasswd (bcrypt for Dex's static password)
        run: sudo apt-get install -y --no-install-recommends apache2-utils
      # Started by a step, like `openbao`: the client secret and the user's password are
      # generated in this job, for a Dex on loopback that ends with the job, and never printed.
      - name: Start Dex v2.46.1 (static client, static password user, memory storage)
        run: |
          secret="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          password="$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          hash="$(htpasswd -nbBC 10 "" "$password" | tr -d ':\n')"
          # Go's bcrypt reads `$2a$`; htpasswd writes the same hash as `$2y$`.
          hash="\$2a${hash#\$2y}"
          mkdir -p "$RUNNER_TEMP/dex"
          cat > "$RUNNER_TEMP/dex/config.yaml" <<EOF
          issuer: http://127.0.0.1:5556/dex
          storage:
            type: memory
          web:
            http: 127.0.0.1:5556
          oauth2:
            skipApprovalScreen: true
          enablePasswordDB: true
          staticClients:
            - id: rdock-ci
              name: rdock CI
              secret: ${secret}
              redirectURIs: ["https://app.test/_rdock/oidc/callback"]
          staticPasswords:
            - email: ci@example.com
              hash: "${hash}"
              username: ci
              userID: 6d5c6b0e-7f4a-4e57-9a43-3c2b6f1d2e10
          EOF
          chmod 644 "$RUNNER_TEMP/dex/config.yaml"
          docker run -d --name dex --network host -v "$RUNNER_TEMP/dex:/etc/dex/cfg:ro" \
            ghcr.io/dexidp/dex@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab \
            dex serve /etc/dex/cfg/config.yaml > /dev/null
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5556/dex/.well-known/openid-configuration > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5556/dex/.well-known/openid-configuration > /dev/null
          {
            echo "RDOCK_DEX_CLIENT_SECRET=$secret"
            echo "RDOCK_DEX_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: "oidc against a real Dex (e2e_oidc.rs, ignored elsewhere)"
        run: cargo test --locked -p rdock --test e2e_oidc -- --ignored --nocapture
        env:
          RDOCK_DEX_ISSUER: http://127.0.0.1:5556/dex
          RDOCK_DEX_CLIENT_ID: rdock-ci
          RDOCK_DEX_USER: ci@example.com
      - name: Dex log
        if: failure()
        run: docker logs dex 2>&1 | tail -n 100

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.180.0
      - name: Scan Rust, workflows and Dockerfile
        run: semgrep scan --metrics=off --error --config p/rust --config p/github-actions --config p/dockerfile
