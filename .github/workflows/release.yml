# Builds static binaries, checksums and the SBOM for every pull request that touches the build,
# and publishes a signed GitHub release for `v*` tags (created by admins only, see the
# "Protect release tags" ruleset). Only the publish job holds write permissions.
#
# Each release contains, per target, rdock-<version>-<target>.tar.gz and
# rdock-<version>-<target>.spdx.json, plus:
#   SHA256SUMS                 checksums of the archives and the SBOMs
#   SHA256SUMS.sigstore.json   keyless cosign signature of SHA256SUMS (verify: SECURITY.md)
# The SBOMs are read from the shipped binaries: the build embeds the exact crate list with
# cargo-auditable and syft reads it back out of the unpacked archive (nothing is read from the
# source tree). Every archive also gets GitHub build-provenance and SBOM attestations
# (`gh attestation verify`).
# Tags also publish the multi-arch image ghcr.io/<owner>/rdock:<version> (Dockerfile.release,
# built from the same binaries), signed with cosign, with a provenance attestation and, per
# platform, an SBOM attestation read from the pushed image. The `latest` image tag and GitHub's
# "Latest release" mark go only to the highest stable version (scripts/release_latest.py).
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - Dockerfile.release

permissions:
  contents: read

# GitHub can start more than one run for a single tag push. Runs for the same tag queue instead
# of racing, and the publish and image jobs never overwrite a release or an image tag that exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Install the pinned toolchain and target
        run: rustup toolchain install && rustup target add "$TARGET"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the dashboard (embedded in the binary, ADR-0024)
        run: |
          pnpm install --frozen-lockfile --filter @reversedock/dashboard...
          pnpm --dir apps/dashboard build
      # cargo-auditable embeds the exact list of crates in the binary (a linker section, no
      # timestamps); the package job reads the SBOM back out of the binary with syft.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-auditable@0.7.7
      - name: Build
        env:
          RDOCK_BUILD_COMMIT: ${{ github.sha }}
        run: cargo auditable build --release --locked -p rdock --target "$TARGET"
      - name: Smoke test
        run: ./target/"$TARGET"/release/rdock version
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="dev-${GITHUB_SHA::7}"; fi
          name="rdock-${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/rdock" LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -l dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdock-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version (tags must match Cargo.toml)
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            cargo_version=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rdock-*
          path: dist
          merge-multiple: true
      - name: Does this version take "latest"?
        id: latest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The tags of this repository are the list of releases (tags are immutable, see the
          # "Protect release tags" ruleset). The rule and its tests: scripts/release_latest.py.
          git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" > tags.txt
          latest=$(python3 -I scripts/release_latest.py "$VERSION" --tags-file tags.txt)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Unpack the archives (the SBOMs describe what is in them)
        run: |
          mkdir -p unpack
          for archive in dist/rdock-*.tar.gz; do tar -xzf "$archive" -C unpack; done
          ls -1 unpack
      # One SBOM per archive, read from the binary inside it. syft finds the crate list that
      # cargo-auditable embedded; it never sees the source tree, the lockfiles, dev dependencies
      # or the Go and npm sources of the repository.
      - name: SBOM (SPDX) of the x86_64 Linux binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: unpack/rdock-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl
          format: spdx-json
          output-file: dist/rdock-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (SPDX) of the aarch64 Linux binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: unpack/rdock-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl
          format: spdx-json
          output-file: dist/rdock-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (SPDX) of the aarch64 macOS binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: unpack/rdock-${{ steps.version.outputs.version }}-aarch64-apple-darwin
          format: spdx-json
          output-file: dist/rdock-${{ steps.version.outputs.version }}-aarch64-apple-darwin.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Every SBOM lists the crates of its binary
        run: |
          # A binary built without cargo-auditable gives an SBOM with no crates; refuse to ship it.
          for archive in dist/rdock-*.tar.gz; do
            sbom="${archive%.tar.gz}.spdx.json"
            [ -s "$sbom" ] || { echo "::error::no SBOM for $archive"; exit 1; }
            crates=$(jq '[.packages[] | select(any(.externalRefs[]?; (.referenceLocator // "") | startswith("pkg:cargo/")))] | length' "$sbom")
            has_rdock=$(jq '[.packages[] | select(.name == "rdock")] | length' "$sbom")
            echo "$sbom: $crates Rust crates, rdock listed: $has_rdock"
            if [ "$crates" -lt 50 ] || [ "$has_rdock" -lt 1 ]; then
              echo "::error::$sbom does not list the crates of the binary (cargo-auditable data missing?)"
              exit 1
            fi
          done
      - name: Checksums (archives and SBOMs)
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      LATEST: ${{ needs.package.outputs.latest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # SBOM attestations (predicate type https://spdx.dev/Document/v<spdxVersion>), one per
      # archive. actions/attest replaces actions/attest-sbom, which its repository marks as
      # deprecated. The SBOMs are also covered by the signed SHA256SUMS.
      - name: SBOM attestation (x86_64 Linux)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/rdock-${{ needs.package.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
          sbom-path: dist/rdock-${{ needs.package.outputs.version }}-x86_64-unknown-linux-musl.spdx.json
      - name: SBOM attestation (aarch64 Linux)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/rdock-${{ needs.package.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
          sbom-path: dist/rdock-${{ needs.package.outputs.version }}-aarch64-unknown-linux-musl.spdx.json
      - name: SBOM attestation (aarch64 macOS)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/rdock-${{ needs.package.outputs.version }}-aarch64-apple-darwin.tar.gz
          sbom-path: dist/rdock-${{ needs.package.outputs.version }}-aarch64-apple-darwin.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not recreating it."
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease);; esac
          # GitHub's own rule marks the newest release "Latest", which would let a patch for an
          # older minor take the mark; say it explicitly (scripts/release_latest.py).
          [ "$LATEST" = true ] || LATEST=false
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ReverseDock $TAG" --generate-notes --latest="$LATEST" "${prerelease[@]}"

  image:
    name: image
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
      LATEST: ${{ needs.package.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Skip versions that are already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rdock"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$image:$VERSION" > /dev/null 2>&1; then
            echo "::notice::$image:$VERSION already exists; image tags are immutable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Unpack the Linux binaries
        if: steps.exists.outputs.skip != 'true'
        run: |
          mkdir -p image/data unpack
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            target="${pair##*:}-unknown-linux-musl"
            tar -xzf "dist/rdock-${VERSION}-${target}.tar.gz" -C unpack
            install -D -m 0755 "unpack/rdock-${VERSION}-${target}/rdock" "image/${arch}/rdock"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.exists.outputs.skip != 'true'
      - name: Build, push and sign
        if: steps.exists.outputs.skip != 'true'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rdock"
          tags=(--tag "$image:$VERSION")
          # Only the highest stable version takes latest (scripts/release_latest.py); an empty
          # answer means no.
          if [ "$LATEST" = true ]; then tags+=(--tag "$image:latest"); fi
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name rdock-release
          docker buildx build --platform linux/amd64,linux/arm64 --file Dockerfile.release \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" --push --metadata-file build.json .
          digest=$(jq -r '."containerimage.digest"' build.json)
          cosign sign --yes "$image@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Image provenance attestation
        if: steps.exists.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # SBOMs of the pushed image, one per platform, read from the registry (the distroless base
      # packages and the crates cargo-auditable embedded in the binary), attested to the
      # platform's manifest digest and stored in the registry next to the image.
      - name: Find the per-platform image digests
        if: steps.exists.outputs.skip != 'true'
        id: platforms
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > index.json
          for arch in amd64 arm64; do
            d=$(jq -r --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else empty end' index.json)
            case "$d" in
              sha256:*) echo "$arch=$d" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::the image index has no single linux/$arch manifest"; exit 1 ;;
            esac
          done
      - name: SBOM (SPDX) of the linux/amd64 image
        if: steps.exists.outputs.skip != 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.image }}@${{ steps.platforms.outputs.amd64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: sbom/rdock-${{ env.VERSION }}-image-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (SPDX) of the linux/arm64 image
        if: steps.exists.outputs.skip != 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.image }}@${{ steps.platforms.outputs.arm64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: sbom/rdock-${{ env.VERSION }}-image-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: The image SBOMs list the crates of the binary
        if: steps.exists.outputs.skip != 'true'
        run: |
          for sbom in sbom/*.spdx.json; do
            crates=$(jq '[.packages[] | select(any(.externalRefs[]?; (.referenceLocator // "") | startswith("pkg:cargo/")))] | length' "$sbom")
            echo "$sbom: $crates Rust crates"
            [ "$crates" -ge 50 ] || { echo "::error::$sbom does not list the crates of the binary"; exit 1; }
          done
      - name: SBOM attestation (linux/amd64 image)
        if: steps.exists.outputs.skip != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.platforms.outputs.amd64 }}
          sbom-path: sbom/rdock-${{ env.VERSION }}-image-linux-amd64.spdx.json
          push-to-registry: true
      - name: SBOM attestation (linux/arm64 image)
        if: steps.exists.outputs.skip != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.platforms.outputs.arm64 }}
          sbom-path: sbom/rdock-${{ env.VERSION }}-image-linux-arm64.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.exists.outputs.skip != 'true'
        with:
          name: image-sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7
