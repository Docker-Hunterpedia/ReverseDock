# Builds static binaries, checksums and the SBOM for every pull request that touches the build,
# and publishes a signed GitHub release for `v*` tags (created by admins only, see the
# "Protect release tags" ruleset). Only the publish job holds write permissions.
#
# Each release contains, per target, rdock-<version>-<target>.tar.gz plus:
#   SHA256SUMS                 checksums of the archives
#   SHA256SUMS.sigstore.json   keyless cosign signature of SHA256SUMS (verify: SECURITY.md)
#   rdock-<version>.spdx.json  SPDX SBOM of the Rust dependencies
# and GitHub build-provenance attestations for every archive (`gh attestation verify`).
# Tags also publish the multi-arch image ghcr.io/<owner>/rdock:<version> (Dockerfile.release,
# built from the same binaries), signed with cosign and attested.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - Dockerfile.release

permissions:
  contents: read

# GitHub can start more than one run for a single tag push. Runs for the same tag queue instead
# of racing, and the publish and image jobs never overwrite a release or an image tag that exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Install the pinned toolchain and target
        run: rustup toolchain install && rustup target add "$TARGET"
      - name: Build
        env:
          RDOCK_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p rdock --target "$TARGET"
      - name: Smoke test
        run: ./target/"$TARGET"/release/rdock version
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="dev-${GITHUB_SHA::7}"; fi
          name="rdock-${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/rdock" LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -l dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdock-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version (tags must match Cargo.toml)
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            cargo_version=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rdock-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/rdock-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not recreating it."
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease);; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ReverseDock $TAG" --generate-notes "${prerelease[@]}"

  image:
    name: image
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Skip versions that are already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rdock"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$image:$VERSION" > /dev/null 2>&1; then
            echo "::notice::$image:$VERSION already exists; image tags are immutable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Unpack the Linux binaries
        if: steps.exists.outputs.skip != 'true'
        run: |
          mkdir -p image/data unpack
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            target="${pair##*:}-unknown-linux-musl"
            tar -xzf "dist/rdock-${VERSION}-${target}.tar.gz" -C unpack
            install -D -m 0755 "unpack/rdock-${VERSION}-${target}/rdock" "image/${arch}/rdock"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.exists.outputs.skip != 'true'
      - name: Build, push and sign
        if: steps.exists.outputs.skip != 'true'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rdock"
          tags=(--tag "$image:$VERSION")
          case "$VERSION" in *-*) ;; *) tags+=(--tag "$image:latest");; esac
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name rdock-release
          docker buildx build --platform linux/amd64,linux/arm64 --file Dockerfile.release \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" --push --metadata-file build.json .
          digest=$(jq -r '."containerimage.digest"' build.json)
          cosign sign --yes "$image@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Image provenance attestation
        if: steps.exists.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
