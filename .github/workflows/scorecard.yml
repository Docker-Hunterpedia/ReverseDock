# OpenSSF Scorecard (not a required check): the repository's supply-chain practices, published
# to the Security tab and to the public Scorecard API. With one maintainer, the Code-Review
# (independent human review of changes) and Contributors (contributors from several
# organisations) checks score low by construction; docs/06-repo-layout.md says so.
# The workflow follows scorecard-action's restrictions for publishing results: no top-level
# env or defaults, and only the actions below in the job.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "53 6 * * 3"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      # Signs the results published to the Scorecard API.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
