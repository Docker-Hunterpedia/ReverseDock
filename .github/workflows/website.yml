# The public website and docs (apps/website, docs/09-website.md). Builds on every change that can
# alter a page: the site itself, the schema and CLI it documents, and the changelog.
# Checks: generated pages are current, every complete config snippet passes `rdock validate
# --strict`, status badges agree with the binary, internal links, types, and WCAG 2.2 AA (axe).
# Deployment is Cloudflare's Git integration (no token here), see apps/website/README.md.
name: website

on:
  pull_request:
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - schema/**
      - CHANGELOG.md
      - crates/rdock/src/**
      - crates/rdock-proxy/src/gate.rs
      - .github/workflows/website.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  website:
    name: website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build rdock (the docs are checked against it)
        run: cargo build --locked -p rdock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated pages are up to date
        working-directory: apps/website
        run: |
          pnpm gen
          git diff --exit-code -- src/content/docs || { echo "::error::Run 'pnpm gen' in apps/website and commit the result"; exit 1; }
      - name: Status badges agree with rdock
        working-directory: apps/website
        run: pnpm check:status
      - name: Config snippets pass rdock validate --strict
        working-directory: apps/website
        run: pnpm check:snippets
      - name: Type check
        working-directory: apps/website
        run: pnpm check
      - name: Build (includes the internal link check)
        working-directory: apps/website
        run: pnpm build
      - name: Accessibility (axe, WCAG 2.2 AA, light and dark)
        working-directory: apps/website
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm check:a11y
      - name: Configuration playground (checks, completion, no requests while editing)
        working-directory: apps/website
        run: pnpm check:playground
