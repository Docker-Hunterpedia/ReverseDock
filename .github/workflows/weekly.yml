# Weekly checks that do not depend on a pull request. Not required checks.
#   advisories    fails when a new RustSec advisory affects the lockfile (pull requests only
#                 see advisories published before they ran).
#   tokio-canary  builds and tests against the newest tokio 1.x, ahead of the lockfile (Pingora
#                 0.9.0 broke on tokio 1.54; the cap went with Pingora 0.9.1). It stays green
#                 either way and reports in the job summary (docs/06-repo-layout.md §2).
name: weekly

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/weekly.yml

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - name: Advisories for the workspace and the fuzz workspace
        run: |
          cargo deny check advisories
          cargo deny --manifest-path tests/fuzz/Cargo.toml check advisories

  tokio-canary:
    name: tokio-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - name: Move to the newest tokio
        run: |
          cargo update -p tokio
          cargo tree -i tokio --depth 0
      - name: Tests with the newest tokio
        id: tests
        continue-on-error: true
        run: cargo nextest run --workspace --no-fail-fast
      - name: Report
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          version=$(cargo tree -i tokio --depth 0 | head -1)
          if [ "$OUTCOME" = success ]; then
            echo "::notice::All tests pass with $version."
            echo "All tests pass with **$version**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Tests fail with $version; do not move the lockfile to it yet."
            echo "Tests fail with **$version**; do not move the lockfile to it yet." >> "$GITHUB_STEP_SUMMARY"
          fi
