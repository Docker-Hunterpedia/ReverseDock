# The 60-second HTTPS proof (ADR-0033, "60-second HTTPS"; docs/01-vision.md §7). Builds the
# release image the way release.yml does (the static musl binary with the embedded dashboard,
# copied into Dockerfile.release), then runs tests/https-60s/run.sh: the documented Compose example
# deploy/docker/examples/https/ with one application container and its labels, against Pebble
# (Let's Encrypt's test CA). It measures the time from `docker compose up -d` to the first HTTPS
# answer whose certificate Pebble issued, prints it, and fails above 60 s. Not a required check: it
# pulls images from Docker Hub and ghcr.io. The run against Let's Encrypt itself is a manual script
# (scripts/https-60s-vps.sh).
name: https-60s

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/https-60s.yml
      - tests/https-60s/**
      - deploy/docker/examples/https/**
      - Dockerfile.release
      - crates/rdock-acme/**
      - crates/rdock-tls/**
      - crates/providers/rdock-provider-docker/**

permissions:
  contents: read

concurrency:
  group: https-60s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  https-60s:
    name: https-60s
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Install the pinned toolchain and target
        run: rustup toolchain install && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: https-60s-${{ env.TARGET }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the dashboard (embedded in the binary, ADR-0024)
        run: |
          pnpm install --frozen-lockfile --filter @reversedock/dashboard...
          pnpm --dir apps/dashboard build
      # As release.yml's build job, without cargo-auditable (which only adds the crate list as a
      # linker section).
      - name: Build the release binary
        env:
          RDOCK_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p rdock --target "$TARGET"
      - name: Build the release image (Dockerfile.release)
        run: |
          mkdir -p image/data
          install -D -m 0755 "target/$TARGET/release/rdock" image/amd64/rdock
          docker build --file Dockerfile.release --tag rdock:release-ci .
          docker run --rm rdock:release-ci version
      - name: Valid HTTPS within 60 s of docker compose up
        env:
          RDOCK_IMAGE: rdock:release-ci
        run: tests/https-60s/run.sh
