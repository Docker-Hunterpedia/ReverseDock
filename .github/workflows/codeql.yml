# CodeQL code scanning (not a required check): Rust, JavaScript/TypeScript (dashboard,
# website, scripts), Go (the Go client and the Terraform provider) and the GitHub Actions
# workflows themselves. Rust is generally available in CodeQL since 2025-10-14
# (https://github.blog/changelog/2025-10-14-codeql-scanning-rust-and-c-c-without-builds-is-now-generally-available,
# read 2026-11-14); code scanning needs no licence on public repositories
# (https://docs.github.com/en/code-security/code-scanning/introduction-to-code-scanning/about-code-scanning,
# read 2026-11-14). Results go to the Security tab; only the analysis job may write them.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/terraform/go.mod
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the Go modules
        if: matrix.language == 'go'
        run: |
          (cd clients/go && go build ./...)
          (cd clients/terraform && go build ./...)
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
