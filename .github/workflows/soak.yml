# Weekly soak of rdock on a free GitHub-hosted runner (ADR-0031, step 9). Not a required check.
#
# What it is: about 5 h 20 min of steady load (benchmarks/soak/hosted) with a configuration reload
# every 5 minutes and, in the first half, a binary upgrade by peer handover every 30 minutes,
# while the process's memory (PSS), descriptors and threads are sampled. The analysis fails the
# job on failed requests, a broken upgrade or held connection, or a sustained rise.
#
# What it is not: the roadmap's 24-hour soak at target RPS on a dedicated machine. That stays
# open until such a machine exists (docs/07-roadmap.md). A hosted runner is a shared virtual
# machine: its speed varies, and a 5-hour window sees leaks of about 10 % of the process's memory
# a day or more (benchmarks/README.md, "Hosted soak").
#
# A scheduled failure just fails the run: no issue is opened (that would need more permissions).
name: soak

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak time as <h>h<m>m, 5h30m at most (the hosted-runner limit is 6 h, the build takes about 10 min)"
        default: 5h20m
  pull_request:
    paths:
      - .github/workflows/soak.yml
      - benchmarks/soak/hosted/**

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  analysis-tests:
    name: analysis-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The analysis rules against synthetic runs (flat, noisy, step, leak, sawtooth, restarts)
        run: python3 -I benchmarks/soak/hosted/test_analyze.py

  soak:
    name: soak
    needs: analysis-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the duration
        id: plan
        env:
          DURATION: ${{ inputs.duration || '5h20m' }}
        run: |
          re='^(([0-9]+)h)?(([0-9]+)m)?$'
          if [[ -z "$DURATION" || ! "$DURATION" =~ $re ]]; then
            echo "::error::duration must look like 5h20m or 90m"
            exit 1
          fi
          minutes=$((10#${BASH_REMATCH[2]:-0} * 60 + 10#${BASH_REMATCH[4]:-0}))
          if ((minutes < 1 || minutes > 330)); then
            echo "::error::duration must be between 1 minute and 5h30m (the job limit is 6 h, with the build)"
            exit 1
          fi
          # Upgrades run every 30 minutes until half the run; allow one to be skipped at the end.
          upgrades=$((minutes / 2 / 30))
          echo "min_upgrades=$((upgrades > 0 ? upgrades - 1 : 0))" >> "$GITHUB_OUTPUT"
          echo "min_reloads=$((minutes * 60 / 300 / 2))" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: Build the release binary
        env:
          RDOCK_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p rdock
      - name: Machine
        run: |
          {
            echo "Runner: $(nproc) CPUs, $(free -g | awk '/^Mem:/ {print $2}') GiB, $(uname -r), commit ${GITHUB_SHA::12}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Soak
        env:
          RDOCK: target/release/rdock
          OUT: ${{ runner.temp }}/soak
          DURATION: ${{ inputs.duration || '5h20m' }}
          MIN_UPGRADES: ${{ steps.plan.outputs.min_upgrades }}
          MIN_RELOADS: ${{ steps.plan.outputs.min_reloads }}
        run: benchmarks/soak/hosted/run.sh
      - name: Report
        if: always()
        env:
          OUT: ${{ runner.temp }}/soak
        run: |
          if [ -f "$OUT/report.md" ]; then cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-${{ github.run_id }}
          # Only the measurements: not the copy of the binary, the data directory or the
          # throw-away TLS key in the same folder.
          path: |
            ${{ runner.temp }}/soak/samples.csv
            ${{ runner.temp }}/soak/load.csv
            ${{ runner.temp }}/soak/failures.csv
            ${{ runner.temp }}/soak/events.csv
            ${{ runner.temp }}/soak/meta.json
            ${{ runner.temp }}/soak/report.md
            ${{ runner.temp }}/soak/analysis.json
            ${{ runner.temp }}/soak/rdock.log
            ${{ runner.temp }}/soak/rdock.yaml
          if-no-files-found: ignore
          retention-days: 90
