version: 2
# Version updates wait 14 days after a release. Security updates are not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # parking_lot 0.13 needs Rust 1.95; our MSRV is 1.89 (docs/06-repo-layout.md §2).
      - dependency-name: parking_lot
        versions: [">= 0.13"]
      # Stays on the version pingora-core builds (see Cargo.toml), so the binary has one brotli.
      - dependency-name: brotli
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /tests/fuzz
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The fuzz crate shares the workspace's brotli line (see the root cargo block).
      - dependency-name: brotli
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "starlight-*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only; lift this when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the Node major the website runs on (24, see .github/workflows/website.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
