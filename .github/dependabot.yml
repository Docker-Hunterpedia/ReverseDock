version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pingora 0.9.0 panics on every connection with tokio >= 1.54 (zero-capacity BufStream).
      # Lift together with the cap in Cargo.toml once the weekly tokio-canary job passes.
      - dependency-name: tokio
        versions: [">= 1.54"]
      # parking_lot 0.13 needs Rust 1.95; our MSRV is 1.89 (docs/06-repo-layout.md §2).
      - dependency-name: parking_lot
        versions: [">= 0.13"]
  - package-ecosystem: cargo
    directory: /tests/fuzz
    schedule:
      interval: monthly
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: tokio
        versions: [">= 1.54"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "type/chore"]
    commit-message:
      prefix: build
      include: scope
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "starlight-*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
